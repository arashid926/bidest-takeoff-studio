<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BidEst Take-Off Studio — NRM2 quantity take-off and bill of quantities for tender estimating."><meta name="theme-color" content="#26356B"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="js/host.js"></script><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BidEst Take-Off Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ============================================================
   BidEst — palette: drafting indigo on blue-biased stone.
   Neutrals carry a slight indigo bias so the accent reads chosen.
   ============================================================ */
:root{
  --ground:#E4E6EC; --surface:#FBFBFD; --surface2:#F1F2F7; --surface3:#E8EAF1;
  --ink:#111420; --ink2:#4A5064; --ink3:#787F94;
  --line:#CBCFDD; --line2:#DDE0EB; --rule:#B9BFD2;
  --accent:#26356B; --accent2:#3C509A; --accent-soft:#DCE1F1; --accent-ink:#1B2750;
  --good:#1D6B4C; --good-soft:#D9EBE1;
  --warn:#8A5B12; --warn-soft:#F4E7CE;
  --crit:#9C2B21; --crit-soft:#F6DFDB;
  --paper:#FCFBF7;            /* dimension-sheet stock */
  --paper-rule:#C9C6B6;
  --shadow:0 1px 1px rgba(17,20,32,.05),0 10px 26px -16px rgba(17,20,32,.35);
  --r:5px;
  --f-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-doc:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F16; --surface:#161A24; --surface2:#1D222E; --surface3:#252B39;
    --ink:#E4E7F0; --ink2:#98A0B6; --ink3:#6C7488;
    --line:#2C3242; --line2:#232838; --rule:#394052;
    --accent:#8FA0E4; --accent2:#A9B6EE; --accent-soft:#1B2140; --accent-ink:#B9C4F2;
    --good:#5FC094; --good-soft:#132A21;
    --warn:#D9A75A; --warn-soft:#2E2410;
    --crit:#E8837A; --crit-soft:#341714;
    --paper:#12151D; --paper-rule:#333A4A;
    --shadow:0 1px 1px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F16; --surface:#161A24; --surface2:#1D222E; --surface3:#252B39;
  --ink:#E4E7F0; --ink2:#98A0B6; --ink3:#6C7488;
  --line:#2C3242; --line2:#232838; --rule:#394052;
  --accent:#8FA0E4; --accent2:#A9B6EE; --accent-soft:#1B2140; --accent-ink:#B9C4F2;
  --good:#5FC094; --good-soft:#132A21;
  --warn:#D9A75A; --warn-soft:#2E2410;
  --crit:#E8837A; --crit-soft:#341714;
  --paper:#12151D; --paper-rule:#333A4A;
  --shadow:0 1px 1px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-ui);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.94em}
.doc{font-family:var(--f-doc)}

/* ---------------- shell ---------------- */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
#rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:16px 16px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.brand .glyph{width:26px;height:26px;flex:none;border:1.5px solid var(--accent);border-radius:3px;
  display:grid;place-items:center;font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--accent)}
.brand b{display:block;font-size:15px;letter-spacing:-.02em}
.brand span{display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3)}
nav{flex:1;padding:8px 0 16px}
.navgrp{padding:12px 16px 4px;font-family:var(--f-num);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink3)}
.navitem{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;
  width:100%;text-align:left;background:none;border:0;padding:6px 16px;cursor:pointer;
  color:var(--ink2);border-left:2px solid transparent;font-size:13px}
.navitem:hover{background:var(--surface2);color:var(--ink)}
.navitem.on{background:var(--accent-soft);color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.navitem .ix{font-family:var(--f-num);font-size:10px;color:var(--ink3)}
.navitem.on .ix{color:var(--accent)}
.navitem .ct{font-family:var(--f-num);font-size:10.5px;color:var(--ink3);
  background:var(--surface3);border-radius:8px;padding:0 6px}
.navitem.on .ct{background:var(--surface);color:var(--accent-ink)}
.railfoot{border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:7px}

main{min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap}
.crumb{font-family:var(--f-num);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.spacer{flex:1}
.kpis{display:flex;gap:14px;align-items:center}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi b{font-family:var(--f-num);font-size:13px;font-weight:600}
.kpi span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
#page{padding:22px 24px 72px;max-width:1360px;width:100%}

/* ---------------- primitives ---------------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--surface2);border-color:var(--rule)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri,
:root:not([data-theme="light"]) .btn.pri{color:#0D0F16}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.gho{background:none;border-color:transparent;color:var(--ink2)}
.btn.gho:hover{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.dgr{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card>header h3{font-size:13.5px}
.card>header .sub{font-size:11.5px;color:var(--ink3)}
.pad{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}

.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.pagehead .eyebrow{font-family:var(--f-num);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.pagehead h2{font-size:22px;letter-spacing:-.025em}
.pagehead p{margin:5px 0 0;color:var(--ink2);font-size:13px;max-width:62ch}

label.f{display:flex;flex-direction:column;gap:4px}
label.f>span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:5px 8px;width:100%;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
input.num,td input{font-family:var(--f-num);font-variant-numeric:tabular-nums}
input[readonly]{background:var(--surface2);color:var(--ink2)}
.hint{font-size:11.5px;color:var(--ink3)}
td input.inh{color:var(--accent);background:var(--accent-soft);font-style:italic}
.typgrp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.typgrp h4{grid-column:1/-1;margin:6px 0 -2px;font-size:12px;font-weight:600;color:var(--ink2)}
.typfol{font-size:11px;color:var(--accent);margin-top:2px;min-height:15px}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;
  background:var(--surface3);color:var(--ink2);border:1px solid var(--line2)}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.wn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.cr{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.ac{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* ---------------- tables ---------------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);padding:8px 9px;border-bottom:1px solid var(--line);background:var(--surface2);
  position:sticky;top:0;white-space:nowrap}
td{padding:4px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td input,td select{padding:3px 6px;font-size:12.5px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{background:var(--surface)}
tr.sect td{background:var(--surface3);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink2)}
tr.tot td{font-weight:600;border-top:1.5px solid var(--rule);background:var(--surface2)}
.mini td,.mini th{padding:3px 7px;font-size:11.5px}

/* ---------------- dimension sheet (traditional dim paper) ---------------- */
.dimsheet{background:var(--paper);border:1px solid var(--paper-rule);border-radius:var(--r);
  overflow-x:auto;box-shadow:var(--shadow)}
.dimsheet table{font-family:var(--f-num);font-size:12px}
.dimsheet th{background:transparent;border-bottom:1.5px solid var(--paper-rule);color:var(--ink2)}
.dimsheet td{border-bottom:1px dotted var(--paper-rule)}
.dimsheet .tim{width:52px;text-align:center;color:var(--ink2);border-right:1px solid var(--paper-rule)}
.dimsheet .dim{width:96px;text-align:right;border-right:1px solid var(--paper-rule);padding-right:12px}
.dimsheet .sq{width:104px;text-align:right;border-right:1.5px solid var(--paper-rule);
  padding-right:12px;font-weight:600}
.dimsheet .de{font-family:var(--f-doc);font-size:13px;padding-left:14px}
.dimsheet tr.hd td{background:var(--surface3);font-family:var(--f-ui);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--paper-rule)}

/* ---------------- BOQ ---------------- */
.boq table{font-size:12.5px}
.boq td.desc{font-family:var(--f-doc);font-size:13.5px;line-height:1.45;max-width:520px}
.boq td.ref{font-family:var(--f-num);font-size:11.5px;color:var(--ink3);white-space:nowrap}
.boq tr.sec td{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;
  font-family:var(--f-ui);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

/* ---------------- misc ---------------- */
.flag{display:flex;gap:9px;padding:9px 12px;border-radius:var(--r);font-size:12.5px;align-items:flex-start}
.flag b{font-weight:600}
.flag.wn{background:var(--warn-soft);color:var(--warn)}
.flag.cr{background:var(--crit-soft);color:var(--crit)}
.flag.ok{background:var(--good-soft);color:var(--good)}
.flag.ac{background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13px}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px}

.bar{height:7px;border-radius:4px;background:var(--surface3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 13px;cursor:pointer;
  color:var(--ink3);font-size:12.5px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}

dialog,.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;
  background:rgba(17,20,32,.5);padding:20px}
.modal.on{display:grid}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mbox>header{padding:13px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.mbox>.body{padding:18px;overflow:auto}
.mbox>footer{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;
  align-items:center;background:var(--surface2)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:20px;font-size:12.5px;
  z-index:99;transition:transform .22s ease;box-shadow:var(--shadow)}
#toast.on{transform:translateX(-50%) translateY(0)}

.ladder{width:100%;max-width:560px;height:auto}
.pdfwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);
  overflow:auto;max-height:64vh;background:var(--surface2)}
.pdfwrap canvas{display:block}
.pdfwrap svg{position:absolute;left:0;top:0;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .navgrp{display:none}
  #page{padding:16px 14px 60px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <div class="brand">

    </div>
    <nav id="nav"></nav>
    <div class="railfoot" id="railfoot"></div>
  </aside>
  <main>
    <div id="topbar"></div>
    <div id="page"></div>
  </main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

/* which slice of a code names its section, per standard */
function secKeyOf(std,code){
  if(!code)return '';
  if(std==='CSI')return code.slice(0,2);
  if(std==='NRM2')return String(code).split('.')[0];
  return String(code).charAt(0);       /* CESMM4 / SMM7 / POMI are letter-classed */
}

  {k:'colD',a:()=>P.columns,w:isRect,fld:'d'},
  {k:'gbB',a:()=>P.beams,w:r=>r.kind==='ground',fld:'b'},
  {k:'gbH',a:()=>P.beams,w:r=>r.kind==='ground',fld:'h'},
  {k:'bmB',a:()=>P.beams,w:r=>r.kind!=='ground',fld:'b'},
  {k:'bmH',a:()=>P.beams,w:r=>r.kind!=='ground',fld:'h'},
  {k:'gsT',a:()=>P.slabs,w:r=>r.type==='ground',fld:'thk'},
  {k:'hardcore',a:()=>P.slabs,w:r=>r.type==='ground',fld:'hardcore'},
  {k:'slabT',a:()=>P.slabs,w:r=>r.type==='solid',fld:'thk'},
  {k:'rcwT',a:()=>P.rcwalls,w:()=>true,fld:'t'},
  {k:'extWallT',a:()=>P.walls,w:r=>r.ext==='y',fld:'t'},
  {k:'intWallT',a:()=>P.walls,w:r=>r.ext!=='y',fld:'t'},
  {k:'gsT',a:()=>P.levels.floors,w:r=>r===lowestFloor(),fld:'slabT'},
  {k:'slabT',a:()=>P.levels.floors,w:r=>r!==lowestFloor(),fld:'slabT'},
  {k:'floorArea',a:()=>P.levels.floors,w:r=>!r.roof,fld:'gfa'}
];
/* A cell follows page one when it is blank, or when it was filled from page one and not typed over since. */
function syncTypicals(){
  if(!P.typ)P.typ=blankProject().typ;
  TYP_MAP.forEach(m=>{
    const v=P.typ[m.k];
    (m.a()||[]).forEach(r=>{
      if(!m.w(r))return;
      const linked=r._t&&r._t[m.fld]===m.k;
      if(isBlank(v)){ if(linked){r[m.fld]='';delete r._t[m.fld];} return; }
      if(isBlank(r[m.fld])||linked){r[m.fld]=v;(r._t=r._t||{})[m.fld]=m.k;}
    });
  });
}
function typFollowers(k){
  let n=0;TYP_MAP.filter(m=>m.k===k).forEach(m=>(m.a()||[]).forEach(r=>{if(m.w(r)&&r._t&&r._t[m.fld]===k)n++;}));
  return n;
}
function relinkAll(){
  TYP_MAP.forEach(m=>{if(isBlank(P.typ[m.k]))return;
    (m.a()||[]).forEach(r=>{if(m.w(r)){r[m.fld]='';if(r._t)delete r._t[m.fld];}});});
  touch();toast('Every schedule row now follows page one');
}
function buildLadder(){
  const G=P.gen,n=Math.max(0,Math.round(num(G.nAbove))),gH=nn(G.gfH),tH=nn(G.typH)!==null?nn(G.typH):gH;
  if(gH===null){toast('Enter the ground floor height first');return;}
  const fl=[];let z=num(G.gfSSL);
  fl.push({key:'GF',name:'Ground Floor',ssl:z,slabT:''});
  z+=gH;
  for(let i=1;i<=n;i++){fl.push({key:'F'+i,name:'Level '+i,ssl:Math.round(z*1000)/1000,slabT:''});z+=tH;}
  if(G.roof==='y')fl.push({key:'RF',name:'Roof',ssl:Math.round(z*1000)/1000,slabT:'',gfa:0,roof:true});
  const keep=P.levels.floors.find(x=>x.parapetH!==undefined);
  if(keep&&fl.length)fl[fl.length-1].parapetH=keep.parapetH;
  P.levels.floors=fl;touch();toast(fl.length+' levels built — slab thickness and floor area follow page one');
}
function gfa(){return sum(floors(),x=>num(x.gfa))||sum(P.slabs.filter(s=>s.type!=='ground'),s=>num(s.area))+sum(P.slabs.filter(s=>s.type==='ground'),s=>num(s.area));}
</script>
<script>
/* ==========================================================================
   Part 2: the measurement engine.
   Pure functions — every quantity is the sum of auditable dimension terms,
   so the dimension sheet and the bill are the same numbers seen twice.
   ========================================================================== */
function TM(lab,times,dims,factor){
  const t=(times===null||times===undefined)?1:num(times);
  const fa=(factor===undefined||factor===null)?1:num(factor);
  const d=dims.map(num);
  return {lab:lab||'',times:t,dims:d,factor:fa,val:t*d.reduce((a,b)=>a*b,1)*fa};
}
function dimExpr(t){
  const p=[];
  if(t.times&&t.times!==1)p.push(t.times+'/');
  t.dims.forEach(d=>p.push(f(d,3)));
  if(t.factor!==1)p.push('× '+f(t.factor,3));
  return p.join(' ');
}
function areaOf(o){ /* rect or circular section */
  if((o.shape||'rect')==='circ')return Math.PI/4*Math.pow(num(o.dia),2);
  return num(o.b)*num(o.d);
}
function perimOf(o){
  if((o.shape||'rect')==='circ')return Math.PI*num(o.dia);
  return 2*(num(o.b)+num(o.d));
}

/* ---------- earthworks: pit = blinding + working space each side, ground level down to underside of blinding ---------- */
function groundLevel(){
  const L=P.levels, NGL=nn(L.NGL), FGL=nn(L.FGL);
  if(NGL!==null)return {gl:NGL,src:'NGL'};
  if(FGL!==null)return {gl:FGL,src:'FGL'};
  return {gl:0,src:'datum'};
}
function sameMark(a,b){return String(a||'').trim().toUpperCase()===String(b||'').trim().toUpperCase();}
function footingEarthworks(ft){
  const O=P.opts, nr=num(ft.nr)||0, Lg=num(ft.L), Wd=num(ft.W), Dp=num(ft.D);
  const tB=num(O.tBlind), ws=num(O.workSpace), bp=num(O.blindProj);
  const G=groundLevel(), bof=nn(ft.bof)!==null?nn(ft.bof):nn(P.levels.BOF);
  const r={nr,gl:G.gl,glSrc:G.src,bof,H:null,bL:Lg+2*bp,bW:Wd+2*bp,eL:Lg+2*bp+2*ws,eW:Wd+2*bp+2*ws,
    exc:0,blind:0,conc:0,neck:0,necks:[],back:0};
  if(!nr||!Lg||!Wd||!Dp||bof===null)return r;
  r.H=G.gl-(bof-tB);
  if(r.H<=0)return r;
  r.exc=nr*r.eL*r.eW*r.H;
  r.blind=nr*r.bL*r.bW*tB;
  r.concH=Math.max(0,Math.min(Dp,G.gl-bof));          /* footing below ground level */
  r.conc=nr*Lg*Wd*r.concH;
  const tof=bof+Dp;
  P.necks.forEach(nk=>{
    const nh=neckHeight(nk);
    if(nh.h===null||nh.h<=0)return;
    const host=P.footings.find(x=>sameMark(x.mark,nk.onFooting))||P.footings[0];
    if(host!==ft)return;
    const below=Math.max(0,Math.min(tof+nh.h,G.gl)-tof);
    if(below<=0)return;
    const v=(num(nk.nr)||0)*areaOf(nk)*below;
    r.neck+=v;r.necks.push({nk,below,v});
  });
  r.back=Math.max(0,r.exc-r.blind-r.conc-r.neck);
  return r;
}
const NECK_WHY={nofooting:'no footing is scheduled to stand it on.',
  nobof:'bottom of footing level (BOF) is not set, on the footing row or on Levels.',
  notop:'there is no ground floor SSL / slab thickness and no finished ground level.'};
/* Neck height: row value, else top of host footing up to the underside of the ground slab */
function neckHeight(nk){
  if(nn(nk.h)!==null)return {h:num(nk.h),src:'row'};
  const L=P.levels, want=String(nk.onFooting||'').trim().toUpperCase();
  const host=want?P.footings.find(x=>String(x.mark||'').trim().toUpperCase()===want):null;
  const ref=host||P.footings[0];
  if(!ref)return {h:null,src:'nofooting'};
  const bof=nn(ref.bof)!==null?nn(ref.bof):nn(L.BOF);
  if(bof===null)return {h:null,src:'nobof'};
  const tof=bof+num(ref.D), g=floors()[0];
  let top=null,src='slab';
  if(g&&nn(g.ssl)!==null)top=num(g.ssl)-num(g.slabT);
  else{const NGL=nn(L.NGL),FGL=nn(L.FGL)===null?NGL:nn(L.FGL);if(FGL!==null){top=FGL;src='fgl';}}
  if(top===null)return {h:null,src:'notop'};
  return {h:Math.round((top-tof)*10000)/10000,src,nohost:!host,ref:ref.mark};
}
function compute(){
  const O=P.opts, L=P.levels, fl=floors();
  const bag={}, order=[], warn=[], assume=[], notes=[];
  const add=(wt,terms,o)=>{
    o=o||{};
    if(!WT[wt]){warn.push('Unknown work type '+wt);return null;}
    const k=wt+'|'+(o.suffix||'');
    let it=bag[k];
    if(!it){
      it={k,wt,unit:o.unit||WT[wt].u,group:WT[wt].g,
          desc:WT[wt].desc+(o.suffix?'; '+o.suffix:''),terms:[],note:o.note||'',flags:[]};
      bag[k]=it;order.push(k);
    }
    (Array.isArray(terms)?terms:[terms]).forEach(t=>{if(t&&isFinite(t.val)&&t.val!==0)it.terms.push(t);});
    if(o.note&&it.note.indexOf(o.note)<0)it.note=(it.note?it.note+' ':'')+o.note;
    if(o.flag&&it.flags.indexOf(o.flag)<0)it.flags.push(o.flag);
    return it;
  };
  const lvName=k=>{const x=floorByKey(k);return x?x.name:(k||'—');};
  const NGL=nn(L.NGL), FGL=(nn(L.FGL)===null?NGL:nn(L.FGL)), BOF=nn(L.BOF);
  const tB=num(O.tBlind), ws=num(O.workSpace), bp=num(O.blindProj), od=num(O.overdig);

  /* ---------- 1. site strip and reduce levels ---------- */
  const siteA=num(L.siteArea);
  if(siteA>0){
    add('site.clear',TM('site area',1,[siteA]));
    if(NGL!==null&&FGL!==null&&NGL>FGL)
      add('exc.rl',TM('reduce level '+f(NGL-FGL,3)+' m',1,[siteA,NGL-FGL]));
    if(NGL!==null&&FGL!==null&&FGL>NGL)
      add('fill.hard',TM('make up levels',1,[siteA,FGL-NGL]),{suffix:'to make up site levels'});
  }else if(P.footings.length){
    assume.push('Site area not entered — site clearance and reduced level excavation are not measured.');
  }

  /* ---------- 2. footings ---------- */
  let excVol=0, blindVol=0, subConc=0, backfill=0;
  const backTerms=[];
  P.footings.forEach(ft=>{
    const nr=num(ft.nr)||0, Lg=num(ft.L), Wd=num(ft.W), Dp=num(ft.D);
    if(!nr||!Lg||!Dp)return;
    const ew=footingEarthworks(ft), bof=ew.bof, H=ew.H;
    const wide=Wd, eL=ew.eL, eW=ew.eW, bL=ew.bL, bW=ew.bW;
    const sfx='mark '+(ft.mark||'?');
    if(bof===null)warn.push('Footing '+(ft.mark||'?')+': bottom of footing level (BOF) missing — set it on the footing row or on Levels. Excavation and backfill not measured.');
    else if(H!==null&&H<=0)warn.push('Footing '+(ft.mark||'?')+': underside of blinding is at or above ground level — no excavation measured.');
    if(H!==null&&H>0){
      const t=TM(sfx+' — blinding + '+f(ws,2)+' m each side × ground level to u/s blinding',nr,[eL,eW,H]); excVol+=t.val;
      add(ft.type==='strip'?'exc.trench':'exc.pit',t,{suffix:'to footings'});
      add('exc.support',TM(sfx,nr,[2*(eL+eW),H]),{suffix:'to sides of foundation excavation'});
      if(nn(L.GWT)!==null&&nn(L.GWT)>bof-tB)
        add('dewater',TM(sfx,0,[0]),{note:'Ground water table at '+f(L.GWT,2)+' m is above formation level.'});
      /* backfill to ground level: pit less blinding, footing and necks below ground */
      backTerms.push(TM(sfx+' excavation',nr,[eL,eW,H]));
      backTerms.push(TM('deduct '+sfx+' blinding',nr,[bL,bW,tB],-1));
      if(ew.concH>0)backTerms.push(TM('deduct '+sfx+' footing',nr,[Lg,Wd,ew.concH],-1));
      ew.necks.forEach(x=>backTerms.push(TM('deduct neck '+(x.nk.mark||'?')+' below ground level',num(x.nk.nr)||0,[areaOf(x.nk),x.below],-1)));
      backfill+=ew.back;
      if(ew.glSrc==='datum')assume.push('No existing or finished ground level entered — excavation taken from ground level at 0.000 (project datum).');
      else if(ew.glSrc==='FGL')assume.push('No existing ground level (NGL) entered — excavation taken from finished ground level.');
    }
    const bt=TM(sfx,nr,[bL,bW,tB]); blindVol+=bt.val;
    add('conc.blind',bt);
    add('comp.surf',TM(sfx,nr,[bL,bW]));
    const ct=TM(sfx,nr,[Lg,wide,Dp]); subConc+=ct.val;
    add(ft.type==='strip'?'conc.strip':(ft.type==='raft'?'conc.raft':'conc.pad'),ct);
    add(ft.type==='strip'?'fw.gbeam':'fw.pad',TM(sfx,nr,[2*(Lg+wide),Dp]),
        {suffix:ft.type==='strip'?'to strip foundations':null});
    const rkg=nn(ft.rebar)!==null?num(ft.rebar):num(ft.type==='raft'?O.rebarRaft:O.rebarPad);
    add('rebar.sub',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),
        {flag:nn(ft.rebar)===null?'est':null});
    if(nn(ft.rebar)===null)assume.push('Foundation reinforcement estimated at '+f(rkg,0)+' kg/m³ — no bar bending schedule supplied.');
  });

  /* ---------- 3. necks / starters below slab ---------- */
  P.necks.forEach(nk=>{
    const nr=num(nk.nr)||0, A=areaOf(nk), nh=neckHeight(nk), H=nh.h;
    const sfx='mark '+(nk.mark||'?');
    if(!nr||!A){if(nk.mark||nr)warn.push('Neck '+(nk.mark||'?')+': number or section size (b × d, or Ø) missing — not measured.');return;}
    if(H===null){warn.push('Neck '+(nk.mark||'?')+': height cannot be derived — '+NECK_WHY[nh.src]+' Enter a height on the row, or complete the Levels page.');return;}
    if(H<=0){warn.push('Neck '+(nk.mark||'?')+': derived height is '+f(H,3)+' m (top of footing at or above the underside of the ground slab) — not measured. Check BOF, footing depth and ground floor SSL.');return;}
    if(nh.src==='fgl')assume.push('Neck '+(nk.mark||'?')+' measured from top of footing to finished ground level — no ground floor slab on the level ladder.');
    if(nh.nohost)assume.push('Neck '+(nk.mark||'?')+': footing "'+(nk.onFooting||'')+'" not found in the footing schedule — height taken from footing '+(nh.ref||'?')+'.');
    const ct=TM(sfx+', '+f(H,3)+' m high',nr,[A,H]); subConc+=ct.val;
    add('conc.neck',ct);
    add('fw.neck',TM(sfx,nr,[perimOf(nk),H]));
    const rkg=nn(nk.rebar)!==null?num(nk.rebar):num(O.rebarNeck);
    add('rebar.sub',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),
        {suffix:'in column necks and starters',flag:nn(nk.rebar)===null?'est':null});
  });

  /* ---------- 4. ground beams (beams flagged ground) ---------- */
  P.beams.filter(b=>b.kind==='ground').forEach(b=>{
    const nr=num(b.nr)||0, bw=num(b.b), h=num(b.h), Lg=num(b.len);
    if(!nr||!bw||!h||!Lg)return;
    const sfx='mark '+(b.mark||'?');
    const ct=TM(sfx,nr,[bw,h,Lg]); subConc+=ct.val;
    add('conc.gbeam',ct);
    add('fw.gbeam',TM(sfx,nr,[2*h,Lg]));
    const rkg=nn(b.rebar)!==null?num(b.rebar):num(O.rebarGbeam);
    add('rebar.sub',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(b.rebar)===null?'est':null});
    if(b.exc==='y'){
      const G=groundLevel(), bof=nn(b.bof);
      if(bof===null)warn.push('Ground beam '+(b.mark||'?')+': underside level missing — trench not measured.');
      else{
        const H=G.gl-(bof-tB), eW=bw+2*bp+2*ws;
        if(H>0){
          const t=TM(sfx+' — blinding + '+f(ws,2)+' m each side',nr,[eW,H,Lg]); excVol+=t.val;
          add('exc.trench',t,{suffix:'to ground beams'});
          const bt=TM(sfx,nr,[bw+2*bp,tB,Lg]); blindVol+=bt.val;
          add('conc.blind',bt);
          const below=Math.max(0,Math.min(h,G.gl-bof));
          backTerms.push(TM(sfx+' trench',nr,[eW,H,Lg]));
          backTerms.push(TM('deduct '+sfx+' blinding',nr,[bw+2*bp,tB,Lg],-1));
          if(below>0)backTerms.push(TM('deduct '+sfx+' beam below ground level',nr,[bw,below,Lg],-1));
          backfill+=Math.max(0,nr*eW*H*Lg-nr*(bw+2*bp)*tB*Lg-nr*bw*below*Lg);
        }
      }
    }
  });

  /* ---------- 5. disposal / backfill balance ---------- */
  if(excVol>0){
    add('fill.back',backTerms,{suffix:'around foundations, up to ground level',
      note:'Excavation less blinding, footings, necks and ground beams below ground level.'});
    add('disp.off',TM('excavated '+f(excVol,2)+' less backfill '+f(backfill,2)+', bulked '+f(O.bulkage,2),1,[Math.max(0,excVol-backfill),num(O.bulkage)]));
  }

  /* ---------- 6. slabs (ground bearing and suspended) ---------- */
  P.slabs.forEach(s=>{
    const A=num(s.area), t=num(s.thk), per=num(s.perim);
    if(!A||!t)return;
    const sfx=(s.mark?'mark '+s.mark+', ':'')+lvName(s.level);
    if(s.type==='ground'){
      const ct=TM(sfx,1,[A,t]);
      add('conc.gslab',ct);
      if(num(s.hardcore)>0)add('fill.hard',TM(sfx,1,[A,num(s.hardcore)]),{suffix:'hardcore bed under ground slab'});
      add('dpm',TM(sfx,1,[A]));
      add('termite',TM(sfx,1,[A]));
      add('conc.blind',TM(sfx+' under slab',1,[A,tB]));
      if(per)add('fw.edge',TM(sfx,1,[per,t]));
      const useMesh=(s.reinf==='mesh');
      if(useMesh)add('mesh',TM(sfx,1,[A],2),{note:'Measured both layers.'});
      else{const rkg=nn(s.rebar)!==null?num(s.rebar):num(O.rebarSlab);
        add('rebar.sub',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(s.rebar)===null?'est':null});}
    }else if(s.type==='hollowcore'){
      add('pc.hollow',TM(sfx,1,[A]));
      if(num(s.topping)>0)add('conc.slab',TM(sfx+' structural topping',1,[A,num(s.topping)]),{suffix:'structural topping to precast units'});
    }else if(s.type==='deck'){
      add('deck.metal',TM(sfx,1,[A]));
      const ct=TM(sfx,1,[A,t]); add('conc.slab',ct,{suffix:'on profiled metal decking'});
      add('mesh',TM(sfx,1,[A]));
    }else{
      const ct=TM(sfx,1,[A,t]);
      add('conc.slab',ct);
      add('fw.soffit',TM(sfx,1,[A]));
      if(per)add('fw.sedge',TM(sfx,1,[per,t]));
      const rkg=nn(s.rebar)!==null?num(s.rebar):num(O.rebarSlab);
      add('rebar.sup',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(s.rebar)===null?'est':null});
    }
  });

  /* ---------- 7. columns ---------- */
  P.columns.forEach(c=>{
    const nr=num(c.nr)||0;
    const H=nn(c.h)!==null?num(c.h):clearHeight(c.level);
    const A=areaOf(c);
    if(!nr||!A||!H)return;
    const sfx='mark '+(c.mark||'?')+', '+lvName(c.level);
    const ct=TM(sfx,nr,[A,H]);
    add('conc.col',ct);
    add('fw.col',TM(sfx,nr,[perimOf(c),H]));
    const rkg=nn(c.rebar)!==null?num(c.rebar):num(O.rebarCol);
    add('rebar.sup',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(c.rebar)===null?'est':null});
    if(nn(c.h)===null&&H)notes.push('Column heights not scheduled — taken from the level ladder as the clear height between structural slabs.');
  });

  /* ---------- 8. beams (suspended) ---------- */
  P.beams.filter(b=>b.kind!=='ground').forEach(b=>{
    const nr=num(b.nr)||0, bw=num(b.b), h=num(b.h), Lg=num(b.len);
    if(!nr||!bw||!h||!Lg)return;
    const flr=floorByKey(b.level), ts=flr?num(flr.slabT):0;
    const dnet=(O.measureNet&&h>ts)?h-ts:h;
    const sfx='mark '+(b.mark||'?')+', '+lvName(b.level);
    const ct=TM(sfx,nr,[bw,dnet,Lg]);
    add('conc.beam',ct,{note:O.measureNet&&ts?'Beams measured net below slab; slab measured over beams.':''});
    add('fw.beam',TM(sfx+' (2 sides + soffit)',nr,[2*dnet+bw,Lg]));
    const rkg=nn(b.rebar)!==null?num(b.rebar):num(O.rebarBeam);
    add('rebar.sup',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(b.rebar)===null?'est':null});
  });

  /* ---------- 9. RC walls ---------- */
  P.rcwalls.forEach(w=>{
    const nr=num(w.nr)||0, Lg=num(w.len), t=num(w.t);
    const H=nn(w.h)!==null?num(w.h):clearHeight(w.level);
    if(!nr||!Lg||!t||!H)return;
    const sfx='mark '+(w.mark||'?')+', '+lvName(w.level);
    const ct=TM(sfx,nr,[Lg,t,H]);
    add(w.retain==='y'?'conc.rwall':'conc.wall',ct);
    add(w.retain==='y'?'fw.rwall':'fw.wall',TM(sfx+' (both faces)',nr,[2*Lg,H]));
    const rkg=nn(w.rebar)!==null?num(w.rebar):num(O.rebarWall);
    add(w.retain==='y'?'rebar.sub':'rebar.sup',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[ct.val,rkg],1/1000),{flag:nn(w.rebar)===null?'est':null});
    if(w.retain==='y'){
      add('wp.ver',TM(sfx,nr,[Lg,H]));
      add('wp.prot',TM(sfx,nr,[Lg,H]));
    }
  });

  /* ---------- 10. staircases ---------- */
  P.stairs.forEach(s=>{
    const nr=num(s.nr)||0, fls=num(s.flights)||1, wdt=num(s.width),
          go=num(s.going), ri=num(s.rise), rn=num(s.risers), wa=num(s.waist);
    if(!nr||!wdt||!rn)return;
    const runL=go*(rn-1), riseT=ri*rn, slope=Math.sqrt(runL*runL+riseT*riseT);
    const sfx='mark '+(s.mark||'?')+', '+lvName(s.level);
    const waist=TM(sfx+' waist on slope',nr*fls,[slope,wdt,wa]);
    const steps=TM(sfx+' steps ½·R·G·W',nr*fls*rn,[0.5*ri*go,wdt]);
    const land=num(s.landing)>0?TM(sfx+' landings',nr,[num(s.landing),num(s.landT)||wa]):null;
    add('conc.stair',[waist,steps,land].filter(Boolean));
    add('fw.stair',[TM(sfx+' soffit',nr*fls,[slope,wdt]),TM(sfx+' risers',nr*fls*rn,[ri,wdt])]);
    const vol=waist.val+steps.val+(land?land.val:0);
    const rkg=nn(s.rebar)!==null?num(s.rebar):num(O.rebarStair);
    add('rebar.sup',TM(sfx+' @ '+f(rkg,0)+' kg/m³',1,[vol,rkg],1/1000),{flag:nn(s.rebar)===null?'est':null});
    if(num(s.balus)>0)add('balus',TM(sfx,nr,[num(s.balus)]));
    if(num(s.hand)>0)add('handrail',TM(sfx,nr,[num(s.hand)]));
  });

  /* ---------- 11. structural steel ---------- */
  let stMass=0;
  const SWT=O.steelSpec==='aramco'?'steel.aramco':'steel.frame';
  P.steel.forEach(s=>{
    const nr=num(s.nr)||0, Lg=stQty(s), kgm=stKgm(s), u=stUnit(s);
    if(!nr||!Lg)return;
    if(!kgm){warn.push('Steel '+(s.mark||'?')+': no unit weight — "'+(s.section||'')+'" is not in the section library. Enter the kg/m.');return;}
    const t=TM((s.mark?s.mark+' ':'')+(s.section||'member')+(s.role?' '+s.role:'')+', '+lvName(s.level)+' @ '+f(kgm,u==='nr'?3:2)+' '+stBasis(s),nr,[Lg,kgm],1/1000);
    stMass+=t.val;
    const bill=stBill(s);
    add(SWT,t,bill?{suffix:bill}:null);
  });
  if(stMass>0&&num(O.steelConn)>0)
    add(SWT,TM('allowance for connections, base plates, cleats and bolts @ '+f(num(O.steelConn),1)+'%',1,[stMass,num(O.steelConn)/100]),
      {note:'Connections taken as '+f(num(O.steelConn),1)+'% of member mass.'});

  /* ---------- 12. walls: masonry, partitions, glazed ---------- */
  const WALLWT={'ext-block':'wall.ext.block','brick':'wall.brick','int-block':'wall.int.block',
                'drywall':'part.dry','glazed':'part.glaz'};
  const deductions={};
  P.openings.forEach(o=>{
    const a=num(o.w)*num(o.h), nr=num(o.nr)||0;
    if(!a||!nr)return;
    if(O.deductOpenings&&a<num(O.deductMin))return;
    if(o.inWall){deductions[o.inWall]=(deductions[o.inWall]||0)+a*nr;}
  });
  P.walls.forEach(w=>{
    const nr=num(w.nr)||0, Lg=num(w.len);
    const H=nn(w.h)!==null?num(w.h):clearHeight(w.level);
    if(!nr||!Lg||!H)return;
    const wt=WALLWT[w.type]||'wall.int.block';
    const sfx=(w.t?f(num(w.t)*1000,0)+' mm thick; ':'')+lvName(w.level);
    const gross=TM((w.mark||'wall')+' gross',nr,[Lg,H]);
    const ded=deductions[w.mark]||0;
    const terms=[gross];
    if(ded>0)terms.push(TM('Deduct openings > '+f(O.deductMin,2)+' m²',1,[-ded]));
    add(wt,terms,{suffix:sfx});
    if(w.ext==='y'){
      add('dpc',TM((w.mark||'wall'),nr,[Lg]));
      if(w.insul==='y')add('cav.insul',TM((w.mark||'wall'),nr,[Lg,H]));
    }
    const net=gross.val-ded;
    [['A',w.finA],['B',w.finB]].forEach(([face,fin])=>{
      if(!fin||fin==='none')return;
      const s2=lvName(w.level)+(w.ext==='y'?(face==='A'?'; external face':'; internal face'):'');
      if(fin==='render')add('render.ext',TM((w.mark||'wall'),1,[net]),{suffix:s2});
      if(fin==='render+paint'){add('render.ext',TM((w.mark||'wall'),1,[net]),{suffix:s2});
        add('paint.ext',TM((w.mark||'wall'),1,[net]),{suffix:s2});}
      if(fin==='plaster')add('plaster.wall',TM((w.mark||'wall'),1,[net]),{suffix:s2});
      if(fin==='plaster+paint'){add('plaster.wall',TM((w.mark||'wall'),1,[net]),{suffix:s2});
        add('paint.int',TM((w.mark||'wall'),1,[net]),{suffix:s2});}
      if(fin==='tile')add('tile.wall',TM((w.mark||'wall'),1,[net]),{suffix:s2});
      if(fin==='clad')add('clad.panel',TM((w.mark||'wall'),1,[net]),{suffix:s2});
    });
  });

  /* ---------- 13. rooms — internal finishes ---------- */
  const roomDed={};
  P.openings.forEach(o=>{
    const a=num(o.w)*num(o.h), nr=num(o.nr)||0;
    if(!a||!nr||!o.room)return;
    if(O.deductOpenings&&a<num(O.deductMin))return;
    roomDed[o.room]=(roomDed[o.room]||0)+a*nr;
  });
  const doorW={};
  P.openings.filter(o=>o.type!=='W').forEach(o=>{
    if(!o.room)return; doorW[o.room]=(doorW[o.room]||0)+num(o.w)*(num(o.nr)||0);
  });
  const FLOORWT={tile:'tile.floor',vinyl:'floor.vinyl',carpet:'floor.carpet',epoxy:'floor.epoxy'};
  P.rooms.forEach(r=>{
    const nr=num(r.nr)||1, A=num(r.area), per=num(r.perim);
    const H=nn(r.ht)!==null?num(r.ht):clearHeight(r.level);
    if(!A)return;
    const sfx=lvName(r.level);
    if(r.floorFin&&r.floorFin!=='none'){
      if(r.floorFin!=='screed')add('screed.fl',TM(r.name||'room',nr,[A]),{suffix:'to receive floor finish'});
      const w=FLOORWT[r.floorFin];
      if(w)add(w,TM(r.name||'room',nr,[A]),{suffix:sfx});
      else if(r.floorFin==='screed')add('screed.fl',TM(r.name||'room',nr,[A]),{suffix:'power floated, left as finish'});
    }
    if(H&&per&&r.wallFin&&r.wallFin!=='none'){
      const gross=TM((r.name||'room')+' girth × height',nr,[per,H]);
      const ded=roomDed[r.name]||0;
      const terms=[gross];
      if(ded>0)terms.push(TM('Deduct openings > '+f(O.deductMin,2)+' m²',1,[-ded]));
      if(r.wallFin==='plaster')add('plaster.wall',terms,{suffix:sfx});
      if(r.wallFin==='plaster+paint'){add('plaster.wall',terms,{suffix:sfx});add('paint.int',clone(terms),{suffix:sfx});}
      if(r.wallFin==='paint')add('paint.int',terms,{suffix:sfx});
      if(r.wallFin==='tile')add('tile.wall',terms,{suffix:sfx});
      if(r.wallFin==='tile+paint'){
        const hT=num(r.tileHt)||2.1;
        add('tile.wall',TM((r.name||'room')+' dado '+f(hT,2)+' m high',nr,[per,hT]),{suffix:sfx});
        add('paint.int',[TM((r.name||'room')+' above dado',nr,[per,Math.max(0,H-hT)]),
          ded>0?TM('Deduct openings',1,[-ded]):null].filter(Boolean),{suffix:sfx});
      }
    }
    if(r.ceilFin&&r.ceilFin!=='none'){
      if(r.ceilFin==='susp')add('ceil.susp',TM(r.name||'room',nr,[A]),{suffix:sfx});
      if(r.ceilFin==='gyp'){add('ceil.gyp',TM(r.name||'room',nr,[A]),{suffix:sfx});
        add('paint.ceil',TM(r.name||'room',nr,[A]),{suffix:sfx});}
      if(r.ceilFin==='paint')add('paint.ceil',TM(r.name||'room',nr,[A]),{suffix:sfx+'; direct to soffit'});
    }
    if(r.skirt==='y'&&per){
      const dw=doorW[r.name]||0;
      add('skirt',[TM((r.name||'room')+' girth',nr,[per]),dw?TM('Deduct door openings',1,[-dw*nr/nr]):null].filter(Boolean),{suffix:sfx});
    }
  });

  /* ---------- 14. openings ---------- */
  P.openings.forEach(o=>{
    const nr=num(o.nr)||0; if(!nr)return;
    const size=f(num(o.w)*1000,0)+' × '+f(num(o.h)*1000,0)+' mm';
    const sfx=(o.mark||'')+' — '+size+(o.spec?'; '+o.spec:'');
    if(o.type==='W'){
      add('window',TM(o.mark||'window',nr,[1]),{suffix:sfx});
      add('glazing',TM(o.mark||'window',nr,[num(o.w),num(o.h)],0.85),
        {suffix:'in window '+(o.mark||''),note:'Glazed area taken as 85% of structural opening.'});
    }else if(o.type==='DE'){
      add('door.ext',TM(o.mark||'door',nr,[1]),{suffix:sfx});
    }else if(o.fire==='y'){
      add('door.fire',TM(o.mark||'door',nr,[1]),{suffix:sfx});
    }else{
      add('door.int',TM(o.mark||'door',nr,[1]),{suffix:sfx});
    }
    if(o.type!=='W'&&o.iron!=='n')
      add('iron.set',TM(o.mark||'door',nr*(num(o.leaves)||1),[1]),{suffix:(o.iron&&o.iron!=='y')?o.iron:'standard set'});
  });

  /* ---------- 15. roofs ---------- */
  P.roofs.forEach(r=>{
    const A=num(r.area); if(!A)return;
    const sfx=r.name||'roof';
    if(r.kind==='pitched'){
      add('roof.tile',TM(sfx,1,[A]));
      add('roof.insul',TM(sfx,1,[A]));
    }else{
      if(num(r.screed)>0)add('roof.screed',TM(sfx+' avg '+f(num(r.screed)*1000,0)+' mm',1,[A]));
      add('roof.insul',TM(sfx,1,[A]));
      add('roof.memb',TM(sfx,1,[A]));
      if(r.prot==='y')add('roof.prot',TM(sfx,1,[A]));
    }
    if(num(r.parapet)>0){
      add('roof.flash',TM(sfx+' copings and flashings',1,[num(r.parapet)]));
      if(num(r.parapetH)>0){
        add('wall.ext.block',TM(sfx+' parapet',1,[num(r.parapet),num(r.parapetH)]),{suffix:'parapet walls'});
        add('roof.memb',TM(sfx+' upstands',1,[num(r.parapet),Math.min(num(r.parapetH),0.5)]),{suffix:'turned up at upstands'});
      }
    }
    if(num(r.outlets)>0)add('rwo',TM(sfx,num(r.outlets),[1]));
    if(num(r.rwp)>0)add('rwp',TM(sfx,1,[num(r.rwp)]));
  });

  /* ---------- 16. joinery, sanitary, services, external ---------- */
  P.joinery.forEach(j=>{if(WT[j.wt]&&num(j.qty))add(j.wt,TM(j.name||'',1,[num(j.qty)]),{suffix:j.spec||j.name||null});});
  P.sanitary.forEach(s=>{if(num(s.nr))add('sanit',TM(s.name||'',num(s.nr),[1]),{suffix:s.name+(s.spec?'; '+s.spec:'')});});
  P.ext.forEach(x=>{if(WT[x.wt]&&num(x.qty))add(x.wt,TM(x.name||'',1,[num(x.qty)]),{suffix:x.spec||null});});
  const GFA=gfa();
  P.mep.forEach(m=>{
    if(!WT[m.wt])return;
    const q=(m.basis==='gfa')?GFA*(num(m.factor)||1):num(m.qty);
    if(!q)return;
    add(m.wt,TM(m.basis==='gfa'?'gross floor area':'as scheduled',1,[q]),
      {unit:m.basis==='item'?'item':WT[m.wt].u,suffix:m.spec||null,
       flag:m.prov==='y'?'prov':null,note:m.prov==='y'?'Provisional — measured on a gross floor area basis pending services design.':''});
  });
  P.custom.forEach(c=>{if(WT[c.wt]&&num(c.qty))add(c.wt,TM(c.note||'as measured',1,[num(c.qty)]),{suffix:c.desc||null,unit:c.unit||null});});

  /* ---------- 17. measurements imported from drawings ---------- */
  (P.measures||[]).filter(m=>m.wt&&WT[m.wt]&&!m.consumed).forEach(m=>{
    add(m.wt,TM((m.name||m.layer||'from drawing')+(m.page?' (p.'+m.page+')':''),1,[num(m.value)]),
      {suffix:m.spec||null,flag:'scaled',
       note:m.src==='pdf'?'Scaled from drawing — confirm against dimensioned information.':''});
  });

  /* ---------- 18. on-screen take-off from drawings ---------- */
  if(typeof tkAddToBill==='function'){try{tkAddToBill(add,warn);}catch(e){warn.push('Take-off could not be added: '+e.message);}}

  /* ---------- finalise ---------- */
  const items=order.map(k=>bag[k]).map(it=>{
    it.qty=sum(it.terms,t=>t.val);
    it.code={}; STANDARDS.forEach(s=>it.code[s]=codeOf(it.wt,s));
    return it;
  }).filter(it=>it.unit==='item'||Math.abs(it.qty)>1e-9);

  items.forEach(it=>{if(it.qty<0)warn.push('Negative quantity in "'+it.desc.slice(0,60)+'" — deductions exceed the measured area.');});
  if(!P.footings.length&&!P.slabs.length&&!P.walls.length&&!P.rooms.length)
    warn.push('No elements measured yet. Enter or import a schedule to begin the take-off.');
  if(BOF===null&&P.footings.length)warn.push('Bottom of footing level not set — excavation depths cannot be derived.');

  const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
  return {items,warn:uniq(warn),assume:uniq(assume.concat(notes)),excVol,subConc,gfa:GFA};
}

/* ---------- abstract: totals per work type, ordered by the live standard ---------- */
function abstractRows(res,std){
  std=std||P.meta.standard;
  const by={};
  res.items.forEach(it=>{
    const s=sectionOf(it.wt,std);
    (by[s.key]=by[s.key]||{key:s.key,name:s.name,items:[]}).items.push(it);
  });
  return Object.values(by).sort((a,b)=>String(a.key).localeCompare(String(b.key),undefined,{numeric:true}))
    .map(g=>{g.items.sort((x,y)=>String(codeOf(x.wt,std)).localeCompare(String(codeOf(y.wt,std)),undefined,{numeric:true})
      ||x.desc.localeCompare(y.desc));return g;});
}

/* ---------- BOQ rows with references and money ---------- */
function boqRows(res,std){
  std=std||P.meta.standard;
  const groups=abstractRows(res,std), out=[];
  let gi=0;
  groups.forEach(g=>{
    gi++;
    out.push({sec:true,ref:String(gi),name:g.name,code:g.key,std});
    g.items.forEach((it,i)=>{
      const r=rateFor(it);
      out.push({sec:false,ref:gi+'.'+String(i+1).padStart(2,'0'),code:codeOf(it.wt,std),
        desc:it.desc,unit:it.unit,qty:it.qty,rate:r.rate,amount:r.rate===null?null:r.rate*it.qty,
        src:r.src,item:it});
    });
  });
  return out;
}

/* ---------- pricing ---------- */
function normCode(c){return String(c||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase();}
function rateFor(it){
  if(P.manualRates[it.k]!==undefined&&P.manualRates[it.k]!==''&&P.manualRates[it.k]!==null)
    return {rate:num(P.manualRates[it.k]),src:'manual'};
  const want=normCode(codeOf(it.wt,'CSI'));
  const book=P.rateBook||[];
  let best=null,bestLen=-1;
  book.forEach(r=>{
    const rc=normCode(r.code);
    if(!rc)return;
    if(rc===want){if(bestLen<99){best=r;bestLen=99;}return;}
    if(want.startsWith(rc)&&rc.length>bestLen&&rc.length>=4){best=r;bestLen=rc.length;}
  });
  if(!best)return {rate:null,src:'none'};
  const O=P.opts;
  const wf=/conc/.test(it.wt)?num(O.wasteConc):/wall|part|brick/.test(it.wt)?num(O.wasteBlock):
           /tile|paint|plaster|screed|ceil|floor|render/.test(it.wt)?num(O.wasteFinish):
           /rebar|mesh|steel/.test(it.wt)?num(O.wasteRebar):0;
  const base=nn(best.total)!==null?num(best.total)
    :num(best.labour)+num(best.material)+num(best.plant)+num(best.sub);
  return {rate:base*(1+wf/100),src:bestLen===99?'book (exact)':'book ('+best.code+')',book:best,waste:wf};
}
function estimate(res){
  const rows=boqRows(res).filter(r=>!r.sec);
  const measured=sum(rows,r=>r.amount||0);
  const unpriced=rows.filter(r=>r.rate===null).length;
  const C=P.commercial;
  const prelim=num(C.prelimLump)||measured*num(C.prelimPct)/100;
  const dayworks=num(C.dayworksLump);
  const net=measured+prelim+dayworks;
  const oh=net*num(C.ohPct)/100;
  const sub=net+oh;
  const infl=sub*num(C.inflationPct)/100;
  const rMode=C.riskMode||'pct',rConf=C.riskConf||'P80';
  const cont=rMode==='register'?0:(sub+infl)*num(C.contingPct)/100;
  const riskAllow=(rMode!=='pct'&&typeof riskCalc==='function'&&P.risks.length)?riskCalc(measured).c[rConf]:0;
  const total=sub+infl+cont+riskAllow;
  const area=res.gfa;
  return {measured,prelim,dayworks,net,oh,sub,infl,cont,riskAllow,rMode,rConf,total,unpriced,priced:rows.length-unpriced,
    rows:rows.length,perM2:area?total/area:null,area};
}
</script>
<script>
/* ==========================================================================
   Part 3: shell, form primitives, editable schedules
   ========================================================================== */
let RES=null, dirtyT=null;
function touch(re){ SAVED.dirty=true; syncTypicals();
  if(typeof scheduleAutosave==='function')scheduleAutosave();
  if(re!==false)render(); }
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(dirtyT);dirtyT=setTimeout(()=>t.classList.remove('on'),ms||2400);}

function fld(label,val,on,o){
  o=o||{};
  const i=el('input',{type:o.type||'text',value:(val===null||val===undefined)?'':val,
    placeholder:o.ph||'',class:o.num?'num':'',step:o.step||'any'});
  i.addEventListener('change',e=>{on(e.target.value);touch();});
  return el('label',{class:'f'},el('span',{},label),i);
}
function selField(label,val,opts,on){
  const s=el('select',{});
  opts.forEach(o=>{const op=el('option',{value:o.v},o.t);if(String(val||'')===String(o.v))op.selected=true;s.append(op);});
  s.addEventListener('change',e=>{on(e.target.value);touch();});
  return el('label',{class:'f'},el('span',{},label),s);
}
function head(eyebrow,title,sub,actions){
  return el('div',{class:'pagehead'},
    el('div',{style:'flex:1;min-width:260px'},
      el('div',{class:'eyebrow'},eyebrow),
      el('h2',{},title),
      sub?el('p',{},sub):null),
    actions?el('div',{class:'row'},actions):null);
}
function card(title,sub,body,actions){
  if(!actions&&title&&typeof SCHED_UPLOADS!=='undefined'&&SCHED_UPLOADS[title])actions=schedUploadButtons(SCHED_UPLOADS[title]);
  return el('section',{class:'card'},
    title?el('header',{},el('h3',{},title),sub?el('div',{class:'sub'},sub):null,
      el('div',{class:'spacer'}),actions||null):null,
    body);
}
function emptyState(t,s,btn){return el('div',{class:'empty'},el('b',{},t),s,btn?el('div',{style:'margin-top:12px'},btn):null);}

/* ---------- generic editable schedule ---------- */
/* cols: {k,t,w,type:'text'|'num'|'sel',opts,dp,calc,ph,foot} */
function schedule(arr,cols,o){
  o=o||{};
  const rows=o.filter?arr.filter(o.filter):arr;
  const t=el('table',{});
  const thead=el('thead',{},el('tr',{},
    cols.map(c=>el('th',{class:(c.type==='num'||c.calc)?'n':'',style:c.w?'width:'+c.w+'px':''},c.t)),
    el('th',{style:'width:64px'},'')));
  const tb=el('tbody',{});
  rows.forEach((row,i)=>{
    const tr=el('tr',{});
    cols.forEach(c=>{
      if(c.calc){
        const v=c.calc(row,i);
        tr.append(el('td',{class:'n'},v===null||v===undefined||(typeof v==='number'&&!isFinite(v))?'—'
          :(typeof v==='number'?f(v,c.dp===undefined?2:c.dp):v)));
        return;
      }
      const td=el('td',{});
      if(c.type==='sel'){
        const s=el('select',{});
        (typeof c.opts==='function'?c.opts():c.opts).forEach(op=>{
          const oe=el('option',{value:op.v},op.t);if(String(row[c.k]||'')===String(op.v))oe.selected=true;s.append(oe);});
        s.addEventListener('change',e=>{row[c.k]=e.target.value;touch();});
        td.append(s);
      }else{
        const inh=!!(row._t&&row._t[c.k]);
        const inp=el('input',{value:(row[c.k]===null||row[c.k]===undefined)?'':row[c.k],
          placeholder:c.ph||'',class:(c.type==='num'?'num':'')+(inh?' inh':''),list:c.list||null,
          title:inh?'From page one (Project → Typical dimensions). Type here to override; clear to follow page one again.':null,
          style:c.type==='num'?'text-align:right':''});
        inp.addEventListener('input',e=>{row[c.k]=c.type==='num'?e.target.value:e.target.value;
          if(row._t&&row._t[c.k]){delete row._t[c.k];inp.classList.remove('inh');}SAVED.dirty=true;paintKpis();});
        inp.addEventListener('change',()=>{if(c.onSet)c.onSet(row,inp.value);touch();});
        td.append(inp);
      }
      tr.append(td);
    });
    tr.append(el('td',{},el('div',{class:'row',style:'gap:2px;flex-wrap:nowrap'},
      el('button',{class:'btn gho sm',title:'Duplicate row',onclick:()=>{const c2=clone(row);
        if(c2.mark)c2.mark=nextMark(c2.mark,arr);arr.splice(arr.indexOf(row)+1,0,c2);touch();}},'⧉'),
      el('button',{class:'btn gho sm dgr',title:'Delete row',onclick:()=>{arr.splice(arr.indexOf(row),1);touch();}},'×'))));
    tb.append(tr);
  });
  if(o.foot&&rows.length){
    const fr=el('tr',{class:'tot'});
    cols.forEach(c=>fr.append(el('td',{class:(c.type==='num'||c.calc)?'n':''},
      c.footLabel?c.footLabel:(c.calc&&c.total!==false?f(sum(rows,r=>{const v=c.calc(r);return isFinite(v)?v:0;}),c.dp===undefined?2:c.dp):''))));

function steelCalcCard(){
  const st={shape:'BU',d:600,d1:400,d2:900,bf:250,tf:12,tw:8,b:200,t:10,h:200,w:100,D:219.1,lip:20};
  const out=el('div',{class:'num',style:'font-size:18px;font-weight:600'});
  const nameOf=()=>({BU:'BU '+st.d+'×'+st.bf+'×'+st.tf+'×'+st.tw,TBU:'TBU '+st.d1+'-'+st.d2+'×'+st.bf+'×'+st.tf+'×'+st.tw,RD:'RD '+st.D,PL:'PL '+st.b+'×'+st.t,
    RHS:'RHS '+st.h+'×'+st.w+'×'+st.t,CHS:'CHS '+st.D+'×'+st.t,C:'C '+st.h+'×'+st.w+'×'+st.lip+'×'+st.t})[st.shape];
  const kg=()=>{const n=k=>num(st[k]);switch(st.shape){
    case 'BU':return builtUpKgm(n('d'),n('bf'),n('tf'),n('tw'));
    case 'TBU':return builtUpKgm((n('d1')+n('d2'))/2,n('bf'),n('tf'),n('tw'));
    case 'RD':return Math.PI/4*n('D')*n('D')*0.00785;
    case 'PL':return plateKgm(n('b'),n('t'));
    case 'RHS':return hollowKgm(n('h'),n('w'),n('t'));
    case 'CHS':return chsKgm(n('D'),n('t'));
    case 'C':return coldKgm(n('h'),n('w'),n('lip'),n('t'));}return 0;};
  const flds=el('div',{class:'grid g4'});
  const F={BU:[['d','Overall depth (mm)'],['bf','Flange width (mm)'],['tf','Flange thk (mm)'],['tw','Web thk (mm)']],
    TBU:[['d1','Depth at small end (mm)'],['d2','Depth at large end (mm)'],['bf','Flange width (mm)'],['tf','Flange thk (mm)'],['tw','Web thk (mm)']],
    RD:[['D','Bar Ø (mm)']],
    PL:[['b','Width (mm)'],['t','Thickness (mm)']],RHS:[['h','Depth (mm)'],['w','Width (mm)'],['t','Wall thk (mm)']],
    CHS:[['D','Outside Ø (mm)'],['t','Wall thk (mm)']],C:[['h','Depth (mm)'],['w','Flange (mm)'],['lip','Lip (mm)'],['t','Thickness (mm)']]};
  const paint=()=>{const v=kg();out.textContent=(isFinite(v)&&v>0?f(v,2):'—')+' kg/m   ·   '+nameOf();};
  const drawF=()=>{flds.replaceChildren(...F[st.shape].map(([k,l])=>{
    const i=el('input',{class:'num',value:st[k]});i.addEventListener('input',e=>{st[k]=e.target.value;paint();});
    return el('label',{class:'f'},el('span',{},l),i);}));paint();};
  const sel=el('select',{style:'max-width:300px'},[['BU','Built-up I / PEB plate girder'],['TBU','Tapered PEB rafter / column (average depth)'],['RD','Round bar — any Ø'],['PL','Plate or flat bar (per m length)'],
    ['RHS','SHS / RHS — any size'],['CHS','CHS / pipe — any size'],['C','Cold-formed C / Z purlin — any size']]
    .map(([v,t])=>el('option',{value:v},t)));
  sel.addEventListener('change',e=>{st.shape=e.target.value;drawF();});
  drawF();
  return card('Section calculator','For PEB built-up members, plates and sizes not in the library',
    el('div',{class:'pad stack'},sel,flds,el('div',{class:'row'},out,el('div',{class:'spacer'}),
      el('button',{class:'btn pri',onclick:()=>{const v=kg();if(v>0)addSteelRow(nameOf(),Math.round(v*100)/100);}},'+ Add to schedule')),
      el('div',{class:'hint'},'Designations typed straight into the schedule are understood too: “BU 600×250×12×8”, “TBU 400-900×250×12×8”, “200Z20”, “PL 300×20”, “PLATE 12”, “RD 20”, “AB M24×600”, “RHS 250×150×8”, “CHS 168.3×6”, “C 200×75×20×2.0”, “W310×60”.')));
}
function nextMark(m,arr){
  const mm=String(m).match(/^(.*?)(\d+)$/);
  if(!mm)return m+'-2';
  let n=parseInt(mm[2],10);
  const has=x=>arr.some(r=>r.mark===x);
  let cand;do{n++;cand=mm[1]+String(n).padStart(mm[2].length,'0');}while(has(cand));
  return cand;
}

function vLevels(){

      fld('Bottom of footing (BOF)',L.BOF,v=>L.BOF=nn(v),{num:1,ph:'-1.500'}),
      fld('Ground water table',L.GWT,v=>L.GWT=nn(v),{num:1,ph:'if encountered'}),
      fld('Site area (m²)',L.siteArea,v=>L.siteArea=nn(v),{num:1,ph:'for clearance & reduce level'}))));

  const fcols=[
    {k:'key',t:'Ref',w:70,ph:'GF'},
    {k:'name',t:'Level name',ph:'Ground Floor'},
    {k:'ssl',t:'SSL (m)',type:'num',ph:'0.000'},
    {k:'slabT',t:'Slab thk (m)',type:'num',ph:'0.200'},
    {k:'gfa',t:'Floor area (m²)',type:'num'},

    {t:'Clear height (m)',calc:r=>clearHeight(r.key),dp:3}
  ];
  w.append(card('Floor ladder','Sorted by structural slab level; the topmost level takes its height from the parapet',
    el('div',{class:'pad'},
      schedule(L.floors,fcols,{blank:()=>({key:'L'+(L.floors.length+1),name:'Level '+(L.floors.length+1),ssl:'',slabT:''}),
        emptyHint:'Add the ground floor first — every derived height hangs off it.'}),
      el('div',{class:'grid g4',style:'margin-top:14px'},
        fld('Height above top slab (parapet, m)',(floors()[floors().length-1]||{}).parapetH,
          v=>{const t=floors()[floors().length-1];if(t)t.parapetH=nn(v);},{num:1,ph:'1.000'})))));

  const D=derivedLevels();
  w.append(card('Derived geometry','Read-only — every figure below is a consequence of the ladder',
    el('div',{class:'pad grid g2'},
      el('div',{},ladderSVG()),
      el('div',{},
        el('table',{class:'mini'},el('tbody',{},
          [['Depth of excavation to formation',D.Hexc,'m'],
           ['Bottom of blinding',D.BOB,'m'],
           ['Top of footing (typical)',D.TOF,'m'],
           ['Neck height below ground slab',D.Hneck,'m'],
           ['Gross floor area scheduled',D.gfa,'m²'],
           ['Number of levels',floors().length,'nr']]
          .map(([l,v,u])=>el('tr',{},el('td',{},l),
            el('td',{class:'n'},v===null||!isFinite(v)?'—':f(v,u==='nr'?0:(u==='m²'?1:3))),
            el('td',{style:'width:34px;color:var(--ink3)'},u)))))),
      )));

  if(notes.length)w.append(el('div',{class:'stack'},notes.map(n=>el('div',{class:'flag '+n[0]},el('div',{},n[1])))));
  return w;
}
function derivedLevels(){
  const L=P.levels,O=P.opts;
  const NGL=nn(L.NGL),FGL=(nn(L.FGL)===null?NGL:nn(L.FGL)),BOF=nn(L.BOF);
  const BOB=BOF===null?null:BOF-num(O.tBlind);
  const comm=(FGL===null?NGL:FGL);
  const Hexc=BOB===null?null:groundLevel().gl-BOB;
  const Df=P.footings.length?num(P.footings[0].D):null;
  const TOF=(BOF===null||Df===null)?null:BOF+Df;
  const g=floors()[0];
  const Hneck=(TOF===null||!g)?null:num(g.ssl)-num(g.slabT)-TOF;
  return {NGL,FGL,BOF,BOB,Hexc,TOF,Hneck,gfa:gfa()};
}
function levelChecks(){
  const L=P.levels,D=derivedLevels(),out=[];
  if(nn(L.BOF)===null)out.push(['wn','Bottom of footing level is not set. Excavation, blinding and neck heights cannot be derived until it is.']);
  if(D.Hexc!==null&&D.Hexc>2.0)out.push(['wn','Excavation depth of '+f(D.Hexc,2)+' m exceeds 2.00 m — NRM2 requires excavation and earthwork support to be split into depth bands. Split the footings by depth, or amend the item descriptions before pricing.']);
  if(nn(L.GWT)!==null&&D.BOB!==null&&nn(L.GWT)>D.BOB)out.push(['cr','Ground water table at '+f(L.GWT,2)+' m is above the bottom of blinding at '+f(D.BOB,2)+' m. Dewatering and, potentially, tanking to the substructure must be priced.']);
  if(D.Hneck!==null&&D.Hneck<0)out.push(['cr','Derived neck height is negative — the top of footing is above the underside of the ground slab. Check BOF, footing depth and ground floor SSL.']);
  const fl=floors();
  for(let i=1;i<fl.length;i++)if(num(fl[i].ssl)-num(fl[i-1].ssl)<2.2)
    out.push(['wn','Storey height between '+fl[i-1].name+' and '+fl[i].name+' is only '+f(num(fl[i].ssl)-num(fl[i-1].ssl),3)+' m — confirm the levels are structural (SSL) and not finished floor levels.']);
  if(!out.length&&fl.length)out.push(['ok','Level ladder is consistent. '+fl.length+' level'+(fl.length===1?'':'s')+' scheduled; derived heights are feeding the take-off.']);
  return out;
}
function ladderSVG(){
  const L=P.levels,D=derivedLevels(),fl=floors();
  const pts=[];
  if(D.BOB!==null)pts.push(['Bottom of blinding',D.BOB,'b']);
  if(D.BOF!==null)pts.push(['BOF',D.BOF,'b']);
  if(D.TOF!==null)pts.push(['Top of footing',D.TOF,'b']);
  if(nn(L.NGL)!==null)pts.push(['NGL',nn(L.NGL),'g']);
  if(nn(L.FGL)!==null&&nn(L.FGL)!==nn(L.NGL))pts.push(['FGL',nn(L.FGL),'g']);
  fl.forEach(x=>pts.push([x.name+' SSL',num(x.ssl),'s']));
  if(!pts.length)return el('div',{class:'hint'},'Enter levels to draw the ladder.');
  const vals=pts.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1;
  const W=440,H=Math.max(200,26*pts.length+40),PADL=150,PADR=64;
  const y=v=>H-24-((v-lo)/span)*(H-52);
  const col={b:'var(--warn)',g:'var(--good)',s:'var(--accent)'};
  const g=['<svg class="ladder" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Level ladder">'];
  g.push('<line x1="'+PADL+'" y1="12" x2="'+PADL+'" y2="'+(H-12)+'" stroke="var(--line)" stroke-width="1"/>');
  pts.sort((a,b)=>a[1]-b[1]).forEach(p=>{
    const yy=y(p[1]).toFixed(1);
    g.push('<line x1="'+PADL+'" y1="'+yy+'" x2="'+(W-PADR)+'" y2="'+yy+'" stroke="'+col[p[2]]+'" stroke-width="1.4" stroke-dasharray="'+(p[2]==='b'?'4 3':'0')+'"/>');
    g.push('<circle cx="'+PADL+'" cy="'+yy+'" r="3" fill="'+col[p[2]]+'"/>');
    g.push('<text x="'+(PADL-8)+'" y="'+(+yy+3.6)+'" text-anchor="end" font-size="10.5" fill="var(--ink2)" font-family="Archivo, sans-serif">'+esc(p[0])+'</text>');
    g.push('<text x="'+(W-PADR+8)+'" y="'+(+yy+3.6)+'" font-size="10.5" fill="var(--ink3)" font-family="JetBrains Mono, monospace">'+f(p[1],3)+'</text>');
  });
  g.push('</svg>');
  return el('div',{html:g.join('')});
}

<script>
/* ==========================================================================

/* ---------- zip / xlsx reader (no library: DecompressionStream) ---------- */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')
    throw new Error('This browser cannot unzip .xlsx files. Save the sheet as CSV and import that.');
  const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),out={};
  let eo=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-66000;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error('That does not look like a valid .xlsx file.');
  const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const comp=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    const lnlen=dv.getUint16(lho+26,true),lelen=dv.getUint16(lho+28,true);
    const st=lho+30+lnlen+lelen;
    out[name]={comp,raw:u8.subarray(st,st+csize)};
    p+=46+nlen+elen+clen;
  }
  return out;
}
async function zipText(entries,name){
  const e=entries[name];if(!e)return null;
  return new TextDecoder().decode(e.comp===0?e.raw:await inflateRaw(e.raw));
}
const decodeXml=s=>String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,'&');
function colIdx(ref){let n=0;for(const ch of String(ref).replace(/[^A-Z]/g,''))n=n*26+(ch.charCodeAt(0)-64);return n-1;}
function colLetter(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function parseSheetXml(xml,ss){
  const rows=[],rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while((rm=rowRe.exec(xml))){
    const inner=rm[1],cells=[],cellRe=/<c([^>]*?)\/>|<c([^>]*?)>([\s\S]*?)<\/c>/g;
    let cm;
    while((cm=cellRe.exec(inner))){
      const attrs=cm[1]||cm[2]||'',body=cm[3]||'';
      const ref=(attrs.match(/r="([A-Z]+)\d+"/)||[])[1];
      const t=(attrs.match(/t="([^"]+)"/)||[])[1];
      let v='';
      if(t==='inlineStr'||t==='str'){
        v=decodeXml((body.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||'');
      }else{
        const vv=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
        if(vv!==undefined)v=(t==='s')?(ss[+vv]!==undefined?ss[+vv]:''):decodeXml(vv);
      }
      const ix=ref?colIdx(ref):cells.length;
      while(cells.length<ix)cells.push('');
      cells[ix]=v;
    }
    rows.push(cells);
  }
  return rows;
}
async function readWorkbook(file){
  const name=file.name.toLowerCase();
  if(/\.(csv|tsv|txt)$/.test(name)){
    return [{name:file.name,rows:parseDelimited(await file.text())}];
  }
  const entries=await unzip(await file.arrayBuffer());
  const ssx=await zipText(entries,'xl/sharedStrings.xml');
  const ss=[];
  if(ssx){
    const si=ssx.match(/<si>[\s\S]*?<\/si>/g)||[];
    si.forEach(s=>ss.push((s.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[])
      .map(t=>decodeXml(t.replace(/<[^>]+>/g,''))).join('')));
  }
  const wb=await zipText(entries,'xl/workbook.xml')||'';
  const names=(wb.match(/<sheet[^>]*\/>/g)||[]).map(s=>decodeXml((s.match(/name="([^"]*)"/)||[])[1]||'Sheet'));
  const out=[];
  const paths=Object.keys(entries).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  for(let i=0;i<paths.length;i++){
    const xml=await zipText(entries,paths[i]);
    out.push({name:names[i]||('Sheet '+(i+1)),rows:parseSheetXml(xml||'',ss)});
  }
  if(!out.length)throw new Error('No worksheets found in that file.');
  return out;
}
function parseDelimited(text){
  const d=(text.split('\n')[0].split('\t').length>text.split('\n')[0].split(',').length)?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

function norm(s){return String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9\/]+/g,' ').trim();}
function autoMap(){
  const rows=IMP.sheets[IMP.si]?IMP.sheets[IMP.si].rows:[];
  /* header row = first row with 2+ non-numeric cells */
  IMP.hdr=0;
  for(let i=0;i<Math.min(rows.length,12);i++){
    const nonNum=rows[i].filter(c=>String(c).trim()&&isNaN(parseFloat(c))).length;
    if(nonNum>=2){IMP.hdr=i;break;}
  }
  const head=(rows[IMP.hdr]||[]).map(norm);
  IMP.map={};
  TARGETS[IMP.target].fields.forEach(fd=>{
    let best=-1,score=0;
    head.forEach((h,i)=>{
      if(!h)return;
      let s=0;
      fd.a.forEach(al=>{const a=norm(al);
        if(h===a)s=Math.max(s,10);
        else if(h.split(' ').indexOf(a)>=0)s=Math.max(s,7);
        else if(h.indexOf(a)>=0&&a.length>2)s=Math.max(s,5);});
      if(norm(fd.t)===h)s=Math.max(s,10);
      if(s>score){score=s;best=i;}
    });
    IMP.map[fd.k]=score>=5?best:-1;
  });
  /* guess millimetres if any mapped length column averages > 50 */
  const lenCols=TARGETS[IMP.target].fields.filter(fd=>fd.len&&IMP.map[fd.k]>=0).map(fd=>IMP.map[fd.k]);
  let vals=[];
  rows.slice(IMP.hdr+1,IMP.hdr+30).forEach(r=>lenCols.forEach(ci=>{const v=parseFloat(r[ci]);if(isFinite(v)&&v>0)vals.push(v);}));
  IMP.mm=vals.length? (vals.reduce((a,b)=>a+b,0)/vals.length)>50 : false;
}
function mappedRows(limit){
  const T=TARGETS[IMP.target],rows=(IMP.sheets[IMP.si]||{rows:[]}).rows,out=[];
  for(let i=IMP.hdr+1;i<rows.length;i++){
    const r=rows[i];if(!r||!r.some(c=>String(c).trim()!==''))continue;
    const o=Object.assign({},T.def,(IMP.preset&&IMP.preset.def)||{});
    let any=false;
    T.fields.forEach(fd=>{
      const ci=IMP.map[fd.k];if(ci===undefined||ci<0)return;
      let v=r[ci];if(v===undefined||String(v).trim()==='')return;
      if(fd.n||fd.len){
        let x=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
        if(!isFinite(x))return;
        if(fd.len&&IMP.mm)x=x/1000;
        v=Math.round(x*1e6)/1e6;
      }else v=String(v).trim();
      o[fd.k]=v;any=true;
    });
    if(any)out.push(coerce(IMP.target,o));
    if(limit&&out.length>=limit)break;
  }
  return out;
}
function coerce(target,o){
  const L=s=>String(s||'').toLowerCase();
  if(target==='openings'){
    if(!(IMP.map&&IMP.map.type>=0)){
      const m=L(o.mark).replace(/[^a-z]/g,''),pre=IMP.preset&&IMP.preset.def&&IMP.preset.def.type;
      if(!pre&&/^(w|win|window|sw|fw)/.test(m))o.type='W';
      else if(pre!=='W'&&(/^(de|ed|ext|mde)/.test(m)||/external|entrance/.test(L(o.spec)+' '+L(o.room))))o.type='DE';
    }
    const t=L(o.type);
    o.type=/w|glaz|window/.test(t)&&!/door/.test(t)?'W':(/ext|external|de\b/.test(t)?'DE':'D');
    o.fire=/y|yes|fr|fire|30|60|90|120/.test(L(o.fire))?'y':'n';
  }
  if(target==='walls'){
    const t=L(o.type);
    o.type=/dry|stud|gyp|partition/.test(t)?'drywall':/glaz/.test(t)?'glazed':
           /brick|facing/.test(t)?'brick':/ext/.test(t)?'ext-block':o.type||'int-block';
    if(!WALLTYPE.some(x=>x.v===o.type))o.type=/y|yes|ext|external|outer/.test(L(o.ext))?'ext-block':'int-block';
    o.ext=/y|yes|ext|external|outer/.test(L(o.ext))?'y':(o.ext?'n':(o.type==='ext-block'||o.type==='brick'?'y':'n'));
    ['finA','finB'].forEach(k=>{const v=L(o[k]);
      if(!v)return;
      o[k]=/tile/.test(v)?'tile':/render/.test(v)&&/paint/.test(v)?'render+paint':/render/.test(v)?'render':
        /plaster/.test(v)&&/paint/.test(v)?'plaster+paint':/plaster/.test(v)?'plaster':
        /paint/.test(v)?'paint':/clad/.test(v)?'clad':'none';});
  }
  if(target==='rooms'){
    const fm={floorFin:{tile:'tile',porcelain:'tile',ceramic:'tile',vinyl:'vinyl',carpet:'carpet',epoxy:'epoxy',screed:'screed'},
      ceilFin:{susp:'susp',grid:'susp',mineral:'susp',gyp:'gyp',gypsum:'gyp',plaster:'gyp',board:'gyp',paint:'paint'}};
    ['floorFin','ceilFin'].forEach(k=>{const v=L(o[k]);if(!v)return;
      const hit=Object.keys(fm[k]).find(x=>v.indexOf(x)>=0);o[k]=hit?fm[k][hit]:o[k];});
    const wv=L(o.wallFin);
    if(wv)o.wallFin=/tile/.test(wv)&&/paint/.test(wv)?'tile+paint':/tile/.test(wv)?'tile':
      /plaster/.test(wv)&&/paint/.test(wv)?'plaster+paint':/plaster/.test(wv)?'plaster':/paint/.test(wv)?'paint':'none';
  }
  if(target==='beams')o.kind=/ground|gb|tie|plinth/.test(L(o.kind)||L(o.mark))?'ground':'sus';
  if(target==='slabs'){const t=L(o.type);
    o.type=/hollow|pc|precast/.test(t)?'hollowcore':/deck|composite|metal/.test(t)?'deck':
      /ground|gs|slab on grade|sog/.test(t)?'ground':'solid';}
  if(target==='columns'||target==='necks')o.shape=(num(o.dia)>0&&!num(o.b))?'circ':'rect';
  if(target==='steel'&&!(num(o.kgm)>0)){const h=steelLookup(o.section);if(h)o.kgm=h.kgm;}
  if(o.level){
    const fl=floors().find(x=>x.key.toLowerCase()===L(o.level)||x.name.toLowerCase()===L(o.level));
    if(fl)o.level=fl.key;
  }
  return o;
}

function mapScore(target){

const DETECT_HINTS={footings:/foot|found|pad|base|fdn/,necks:/neck|starter|stub/,columns:/col/,beams:/beam|lintel|gb/,
  slabs:/slab/,walls:/wall|partition|block/,rooms:/room|finish|space/,openings:/door|window|opening|glaz/,
  steel:/steel|member|section/,rateBook:/rate|price|boq|cost/};
function uploadAnySchedule(){
  pickSheetFile(async file=>{
    IMP.sheets=await readWorkbook(file);IMP.file=file.name;IMP.mm=false;IMP.preset=null;
    const fn=file.name.toLowerCase();
    let best='footings',bs=-1,bestSi=0;
    Object.keys(TARGETS).forEach(t=>{
      IMP.sheets.forEach((sh,i)=>{IMP.si=i;
        let sc=mapScore(t);
        const hint=DETECT_HINTS[t];
        if(hint&&hint.test(fn))sc+=0.6;
        if(hint&&hint.test(String(sh.name).toLowerCase()))sc+=0.4;
        if(sc>bs){bs=sc;best=t;bestSi=i;}});
    });
    IMP.target=best;IMP.si=bestSi;autoMap();
    if(best==='openings'&&/window/.test(fn)&&!/door/.test(fn))IMP.preset=SCHED_UPLOADS['Door and window schedule'][1];
    else if(best==='openings'&&/door/.test(fn)&&!/window/.test(fn))IMP.preset=SCHED_UPLOADS['Door and window schedule'][0];
    IMP.mode='replace';
    openImportWizard();
    toast('Read as '+TARGETS[best].label.toLowerCase()+' — change “Import into” if that is wrong.',5000);
  });
}
