/* ---------- DXF ---------- */
let DXF=null;
function parseDXF(text){
  const lines=text.split(/\r?\n/);
  const layers={};
  const L=n=>{const k=(n===undefined||n==='')?'0':n;
    return layers[k]||(layers[k]={name:k,len:0,area:0,count:0,entities:0});};
  const WANT={LINE:1,CIRCLE:1,ARC:1,LWPOLYLINE:1,POLYLINE:1,INSERT:1,POINT:1};
  const shapes=[];
  let cur=null,codes=null;
  const flush=()=>{
    if(!cur||!codes){cur=null;codes=null;return;}
    const lay=L((codes['8']||[])[0]);lay.entities++;
    const g=k=>parseFloat((codes[String(k)]||[])[0]);
    const xs=(codes['10']||[]).map(parseFloat),ys=(codes['20']||[]).map(parseFloat);
    if(cur==='LINE'){
      const dx=g(11)-xs[0],dy=g(21)-ys[0];
      if(isFinite(dx)&&isFinite(dy))lay.len+=Math.hypot(dx,dy);
    }else if(cur==='CIRCLE'){
      const r=g(40);if(isFinite(r)&&r>0){lay.len+=2*Math.PI*r;lay.area+=Math.PI*r*r;
        shapes.push({layer:lay.name,closed:true,len:2*Math.PI*r,area:Math.PI*r*r});}
    }else if(cur==='ARC'){
      const r=g(40),a1=g(50),a2=g(51);
      if(isFinite(r)&&isFinite(a1)&&isFinite(a2)){const sw=(((a2-a1)%360)+360)%360;lay.len+=2*Math.PI*r*sw/360;}
    }else if(cur==='LWPOLYLINE'||cur==='POLYLINE'){
      let pts=[];
      for(let i=0;i<Math.min(xs.length,ys.length);i++)
        if(isFinite(xs[i])&&isFinite(ys[i]))pts.push([xs[i],ys[i]]);
      if(cur==='POLYLINE'&&pts.length>1)pts=pts.slice(1);  /* header vertex is a dummy */
      let len=0;
      for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      const closed=(parseInt((codes['70']||['0'])[0],10)&1)===1;
      if(closed&&pts.length>2){
        len+=Math.hypot(pts[0][0]-pts[pts.length-1][0],pts[0][1]-pts[pts.length-1][1]);
        let a=0;
        for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1];}
        lay.area+=Math.abs(a)/2;
        shapes.push({layer:lay.name,closed:true,len:len,area:Math.abs(a)/2});
      }else if(pts.length>1)shapes.push({layer:lay.name,closed:false,len:len,area:0});
      lay.len+=len;
    }else if(cur==='INSERT'||cur==='POINT'){lay.count++;}
    cur=null;codes=null;
  };
  for(let i=0;i+1<lines.length;i+=2){
    const code=lines[i].trim(),val=lines[i+1];
    if(code==='0'){
      const v=val.trim().toUpperCase();
      if(v==='VERTEX'&&cur==='POLYLINE')continue;   /* vertices append to the parent polyline */
      flush();
      if(WANT[v]){cur=v;codes={};}
      continue;
    }
    if(!codes)continue;
    (codes[code]=codes[code]||[]).push(val.trim());
  }
  flush();
  return {layers:Object.values(layers).filter(l=>l.entities>0)
    .sort((a,b)=>(b.len+b.area+b.count)-(a.len+a.area+a.count)),shapes:shapes};
}
function dxfPanel(){
  const inp=el('input',{type:'file',accept:'.dxf,.txt',style:'display:none'});
  inp.addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const parsed=parseDXF(await file.text());
      DXF={file:file.name,layers:parsed.layers,shapes:parsed.shapes,scale:0.001};
      parsed.layers.forEach(l=>{l.wt='';l.use='len';});
      toast(parsed.layers.length+' layers read from '+file.name);
      render();
    }catch(err){toast('Could not parse that DXF: '+err.message);}
    inp.value='';
  });
  const body=el('div',{class:'pad'});
  body.append(el('div',{class:'row'},
    el('button',{class:'btn pri',onclick:()=>inp.click()},'Choose a .dxf file'),inp,
    DXF?selField('Drawing units',String(DXF.scale),[{v:'0.001',t:'millimetres'},{v:'0.01',t:'centimetres'},{v:'1',t:'metres'},{v:'0.3048',t:'feet'}],
      v=>{DXF.scale=parseFloat(v);render();}):null,
    el('span',{class:'hint'},'Export the CAD sheet as DXF (R12 or 2000 ASCII). Native .dwg cannot be read in a browser.')));
  if(!DXF){
    body.append(emptyState('No DXF loaded',
      'Lengths come from lines, polylines and arcs; areas from closed polylines; counts from block inserts. Assign a layer to a work section and the quantity joins the take-off.'));
    return card('CAD layer take-off',null,body);
  }
  const wtOpts=[{v:'',t:'— not measured —'}].concat(WT_KEYS.map(k=>({v:k,t:WT[k].g+' — '+WT[k].desc.split(';')[0]+'  ('+WT[k].u+')'})));
  if(typeof dxfAutoPanel==='function'){const ap=dxfAutoPanel();if(ap)body.append(ap);}
  body.append(el('h4',{style:'margin:18px 0 0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)'},
    'Every layer — map by hand'));
  body.append(el('div',{class:'tw',style:'margin-top:8px'},el('table',{},
    el('thead',{},el('tr',{},['Layer','Entities','Length','Area','Blocks','Use','Measure as',''].map((h,i)=>el('th',{class:i>0&&i<5?'n':''},h)))),
    el('tbody',{},DXF.layers.map(l=>{
      const s=DXF.scale;
      return el('tr',{},
        el('td',{style:'font-family:var(--f-num);font-size:11.5px'},l.name),
        el('td',{class:'n'},l.entities),
        el('td',{class:'n'},f(l.len*s,2)+' m'),
        el('td',{class:'n'},f(l.area*s*s,2)+' m²'),
        el('td',{class:'n'},l.count),
        el('td',{},(()=>{const sel=el('select',{});
          [{v:'len',t:'Length'},{v:'area',t:'Area'},{v:'count',t:'Count'}].forEach(o=>{
            const oe=el('option',{value:o.v},o.t);if(l.use===o.v)oe.selected=true;sel.append(oe);});
          sel.addEventListener('change',e=>{l.use=e.target.value;});return sel;})()),
        el('td',{},(()=>{const sel=el('select',{});
          wtOpts.forEach(o=>{const oe=el('option',{value:o.v},o.t);if(l.wt===o.v)oe.selected=true;sel.append(oe);});
          sel.addEventListener('change',e=>{l.wt=e.target.value;});return sel;})()),
        el('td',{},el('button',{class:'btn sm',onclick:()=>{
          if(!l.wt){toast('Pick a work section for this layer first.');return;}
          const v=l.use==='len'?l.len*s:l.use==='area'?l.area*s*s:l.count;
          if(!v){toast('That layer has no quantity of that kind.');return;}
          P.measures.push({id:uid('m'),src:'dxf',name:l.name,layer:l.name,type:l.use,value:v,
            wt:l.wt,unit:WT[l.wt].u,file:DXF.file});
          touch();toast('Added '+f(v,2)+' '+WT[l.wt].u+' from layer '+l.name);
        }},'Add')));
    })))));
  return card('CAD layer take-off — '+DXF.file,'Quantities are geometric; confirm layer discipline before relying on them',body);
}

/* ---------- PDF measure-assist ---------- */
let PDFS={doc:null,page:1,pages:0,mPerUnit:null,tool:'cal',pts:[],canvas:null,zoom:1.4,name:'',auto:null};
function pdfPanel(){
  const body=el('div',{class:'pad'});
  const inp=el('input',{type:'file',accept:'.pdf',style:'display:none'});
  inp.addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    if(typeof pdfjsLib==='undefined'){toast('The PDF engine did not load — check the network and reload.');return;}
    try{
      const buf=await file.arrayBuffer();
      PDFS.doc=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;
      PDFS.pages=PDFS.doc.numPages;PDFS.page=1;PDFS.name=file.name;PDFS.mPerUnit=null;PDFS.pts=[];PDFS.auto=null;
      render();setTimeout(drawPdfPage,50);
    }catch(err){toast('Could not open that PDF: '+err.message);}
    inp.value='';
  });
  body.append(el('div',{class:'row'},
    el('button',{class:'btn pri',onclick:()=>inp.click()},'Choose a .pdf drawing'),inp,
    PDFS.doc?el('span',{class:'row'},
      el('button',{class:'btn sm',onclick:()=>{if(PDFS.page>1){PDFS.page--;PDFS.pts=[];render();setTimeout(drawPdfPage,20);}}},'‹'),
      el('span',{class:'chip'},'Page '+PDFS.page+' of '+PDFS.pages),
      el('button',{class:'btn sm',onclick:()=>{if(PDFS.page<PDFS.pages){PDFS.page++;PDFS.pts=[];render();setTimeout(drawPdfPage,20);}}},'›'),
      el('button',{class:'btn sm',onclick:()=>{PDFS.zoom=Math.max(0.5,PDFS.zoom-0.3);setTimeout(drawPdfPage,20);}},'−'),
      el('button',{class:'btn sm',onclick:()=>{PDFS.zoom=Math.min(4,PDFS.zoom+0.3);setTimeout(drawPdfPage,20);}},'+')):null));
  if(!PDFS.doc){
    body.append(emptyState('No drawing loaded',
      'Open a plan, calibrate it against a known dimension, then trace lengths, areas and counts. Scaled quantities carry a warning through to the bill and the risk register.'));
    return card('PDF measure-assist',null,body);
  }
  const cal=mPerPx();
  body.append(el('div',{class:'row',style:'margin-top:12px'},
    ['cal','line','area','count'].map(t=>el('button',{class:'btn'+(PDFS.tool===t?' pri':''),
      onclick:()=>{PDFS.tool=t;PDFS.pts=[];render();setTimeout(drawPdfPage,20);}},
      ({cal:'1 · Calibrate',line:'2 · Length',area:'3 · Area',count:'4 · Count'})[t])),
    el('div',{class:'spacer'}),
    el('span',{class:'chip'+(cal?' ok':' wn')},cal?('Scale set — 1 px = '+f(cal,4)+' m'):'Not calibrated'),
    el('button',{class:'btn sm',onclick:()=>{PDFS.pts=[];drawOverlay();}},'Clear points'),
    el('button',{class:'btn sm',onclick:finishPdfMeasure,disabled:PDFS.tool==='cal'?true:null},'Record measurement')));
  body.append(el('div',{class:'row',style:'margin-top:8px'},
    el('span',{class:'hint',style:'width:100%;margin-bottom:2px'},'Automatic — works on a PDF exported from CAD, not on a scan'),
    el('button',{class:'btn',onclick:pdfAutoScale},'Auto-scale from the title block'),
    el('button',{class:'btn',onclick:pdfReadTables},'Read schedule tables'),
    el('button',{class:'btn',onclick:pdfScanGeometry},'Scan the drawing geometry')));
  body.append(el('div',{class:'pdfwrap',id:'pdfwrap',style:'margin-top:12px'},
    el('canvas',{id:'pdfcanvas'}),el('svg',{id:'pdfsvg'})));
  if(typeof pdfAutoPanel==='function'){const ap=pdfAutoPanel();if(ap)body.append(ap);}
  body.append(el('div',{class:'legend',style:'margin-top:10px'},
    el('span',{},'Click to place points. ',
      PDFS.tool==='cal'?'Pick two ends of a dimension you know, then type its real length.':
      PDFS.tool==='line'?'Click along the run; the total length is the sum of the segments.':
      PDFS.tool==='area'?'Click round the outline; the polygon closes itself.':
      'Click once on each item to count it.'),
    el('span',{class:'num'},readout())));
  return card('PDF measure-assist — '+PDFS.name,'Scaled, not dimensioned — every quantity taken here is flagged',body);
}
function readout(){
  const s=mPerPx()||0,p=PDFS.pts;
  if(PDFS.tool==='count')return p.length+' nr';
  if(p.length<2)return '—';
  let len=0;for(let i=1;i<p.length;i++)len+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  if(PDFS.tool==='area'){
    let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i].x*q.y-q.x*p[i].y;}
    return f(Math.abs(a)/2*s*s,2)+' m²';
  }
  return f(len*s,2)+' m'+(PDFS.tool==='cal'?'  (pixels: '+f(len,1)+')':'');
}
async function drawPdfPage(){
  if(!PDFS.doc)return;
  const cv=$('#pdfcanvas');if(!cv)return;
  const page=await PDFS.doc.getPage(PDFS.page);
  const vp=page.getViewport({scale:PDFS.zoom});
  cv.width=vp.width;cv.height=vp.height;
  const svg=$('#pdfsvg');
  svg.setAttribute('width',vp.width);svg.setAttribute('height',vp.height);
  svg.setAttribute('viewBox','0 0 '+vp.width+' '+vp.height);
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect();
    PDFS.pts.push({x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height});
    if(PDFS.tool==='cal'&&PDFS.pts.length===2)askCalibration();
    drawOverlay();
  };
  drawOverlay();
}
function drawOverlay(){
  const svg=$('#pdfsvg');if(!svg)return;
  const p=PDFS.pts,g=[];
  const col=PDFS.tool==='cal'?'#9C2B21':PDFS.tool==='area'?'#26356B':PDFS.tool==='count'?'#1D6B4C':'#8A5B12';
  if(p.length>1){
    const d=p.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' ')+(PDFS.tool==='area'?' Z':'');
    g.push('<path d="'+d+'" fill="'+(PDFS.tool==='area'?col+'33':'none')+'" stroke="'+col+'" stroke-width="2"/>');
  }
  p.forEach(q=>g.push('<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4" fill="'+col+'" stroke="#fff" stroke-width="1.5"/>'));
  svg.innerHTML=g.join('');
  const l=$('.legend .num');if(l)l.textContent=readout();
}
function askCalibration(){
  const p=PDFS.pts,px=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);
  const inp=el('input',{class:'num',placeholder:'e.g. 6.000',style:'max-width:180px'});
  openModal('Calibrate the drawing',
    el('div',{},
      el('p',{class:'hint',style:'margin-top:0'},'You picked a line '+f(px,1)+' pixels long. What is that distance on the building, in metres?'),
      el('label',{class:'f'},el('span',{},'Real length (m)'),inp)),
    [el('button',{class:'btn pri',onclick:()=>{
      const v=parseFloat(inp.value);
      if(!isFinite(v)||v<=0){toast('Enter a positive length.');return;}
      PDFS.mPerUnit=v*PDFS.zoom/px;PDFS.pts=[];PDFS.tool='line';closeModal();render();setTimeout(drawPdfPage,20);
      toast('Scale set. 1 pixel = '+f(mPerPx(),4)+' m at this zoom');
    }},'Set scale'),el('button',{class:'btn',onclick:()=>{PDFS.pts=[];closeModal();drawOverlay();}},'Cancel')]);
  setTimeout(()=>inp.focus(),60);
}
function finishPdfMeasure(){
  if(PDFS.tool==='cal')return;
  const SC=mPerPx();
  if(SC===null&&PDFS.tool!=='count'){toast('Set the scale first — auto-scale from the title block, or calibrate on a known dimension.');return;}
  const p=PDFS.pts;
  let val=0,type=PDFS.tool;
  if(type==='count')val=p.length;
  else if(type==='area'){
    if(p.length<3){toast('An area needs at least three points.');return;}
    let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i].x*q.y-q.x*p[i].y;}
    val=Math.abs(a)/2*SC*SC;
  }else{
    if(p.length<2){toast('A length needs at least two points.');return;}
    let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    val=L*SC;
  }
  const nameI=el('input',{placeholder:'e.g. External wall, grid A–F'});
  const wtS=el('select',{});
  [{v:'',t:'— hold as a measurement only —'}].concat(
    WT_KEYS.filter(k=>WT[k].u===(type==='count'?'nr':type==='area'?'m2':'m'))
      .map(k=>({v:k,t:WT[k].g+' — '+WT[k].desc.split(';')[0]})))
    .forEach(o=>wtS.append(el('option',{value:o.v},o.t)));
  openModal('Record measurement',
    el('div',{class:'grid g2'},
      el('label',{class:'f'},el('span',{},'Name'),nameI),
      el('label',{class:'f'},el('span',{},'Measure as'),wtS),
      el('div',{class:'flag ac'},el('div',{},el('b',{},f(val,2)+' '+(type==='count'?'nr':type==='area'?'m²':'m')),
        ' scaled from page '+PDFS.page+' of '+PDFS.name+'.'))),
    [el('button',{class:'btn pri',onclick:()=>{
      P.measures.push({id:uid('m'),src:'pdf',name:nameI.value||('Measurement '+(P.measures.length+1)),
        type,value:val,wt:wtS.value,unit:type==='count'?'nr':type==='area'?'m2':'m',
        page:PDFS.page,file:PDFS.name});
      PDFS.pts=[];closeModal();touch();toast('Measurement recorded');
    }},'Record'),el('button',{class:'btn',onclick:closeModal},'Cancel')]);
  setTimeout(()=>nameI.focus(),60);
}
function measuresPanel(){
  const wtOpts=[{v:'',t:'— not in the bill —'}].concat(WT_KEYS.map(k=>({v:k,t:WT[k].desc.split(';')[0]+'  ('+WT[k].u+')'})));
  return card('Measurements taken off drawings','These flow into the take-off flagged as scaled',
    el('div',{class:'pad'},schedule(P.measures,[
      {k:'name',t:'Description'},
      {t:'Source',calc:r=>(r.src==='pdf'?'PDF p.'+r.page:'DXF '+(r.layer||'')),total:false},
      {t:'Kind',calc:r=>({len:'Length',area:'Area',count:'Count'})[r.type]||r.type,total:false},
      {k:'value',t:'Quantity',type:'num'},
      {t:'Unit',calc:r=>r.unit==='m2'?'m²':r.unit,total:false},
      {k:'wt',t:'Measured as',type:'sel',w:280,opts:wtOpts},
      {k:'spec',t:'Description suffix'}
    ],{emptyHint:'Take a measurement off a DXF layer or a PDF drawing and it appears here.'})));
}

<script>
/* ==========================================================================
   Part 6: outputs — dimension sheet, abstract, bill, estimate, risk
   ========================================================================== */
function vTakeoff(){
  const res=RES||compute();
  const w=el('div',{class:'stack'});

    [el('button',{class:'btn',onclick:()=>exportCSV('dimensions')},'Export CSV')]));
  const groups={};
  res.items.forEach(it=>(groups[it.group]=groups[it.group]||[]).push(it));

    rows.push(el('tr',{class:'hd'},el('td',{colspan:4},g)));
    groups[g].forEach(it=>{
      it.terms.forEach(function(t,i){
        const desc = i===0
          ? el('span',{},it.desc, t.lab?el('span',{style:'color:var(--ink3)'},'   '+t.lab):null)
          : el('span',{style:'color:var(--ink3)'},t.lab||'');
        rows.push(el('tr',{},
          el('td',{class:'tim'},t.times&&t.times!==1?t.times+'/':''),
          el('td',{class:'dim'},t.dims.map(d=>f(d,3)).join(' × ')+(t.factor!==1?'  ×'+f(t.factor,3):'')),
          el('td',{class:'sq'},f(t.val,P.opts.dpQty)),
          el('td',{class:'de'},desc)));
      });
      rows.push(el('tr',{},
        el('td',{class:'tim'},''),el('td',{class:'dim'},''),
        el('td',{class:'sq',style:'border-top:1.5px solid var(--paper-rule)'},qfmt(it.qty,it.unit)+' '+unitLabel(it.unit)),
        el('td',{class:'de',style:'color:var(--ink3);font-style:italic'},
          'Total — '+it.desc.split(';')[0]+(it.flags.length?'   ['+it.flags.join(', ')+']':''))));
    });
  });
  w.append(el('div',{class:'dimsheet'},el('table',{},
    el('thead',{},el('tr',{},el('th',{class:'tim'},'Times'),el('th',{class:'dim'},'Dimensions'),

function uploadRateList(){

    const file=e.target.files[0];inp.remove();if(!file)return;

      IMP.target='rateBook';IMP.mm=false;IMP.mode=(P.rateBook||[]).length?'append':'replace';
      /* pick the first worksheet that has a recognisable rate header */

function downloadRateTemplate(){
  /* every CSI code the measurement engine can bill, one line each */
  const seen={},codes=[];
  WT_KEYS.forEach(k=>{const w=WT[k];
    if(!w.c||w.g===G.COM)return;
    const n=normCode(w.c);if(seen[n])return;seen[n]=1;
    codes.push([w.c,String(w.desc).split(';')[0].trim(),w.u]);});
  codes.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
  const H=['CSI code','Description','Unit','Labour','Material','Plant','Subcontract','Total rate','Region / source'];
  const rows=[H.map(h=>TX(h,ST.hdr))];
  codes.forEach(([c,d,u])=>rows.push([TX(c,ST.code),TX(d),TX(u,ST.unit),
    NM('',ST.rateIn),NM('',ST.rateIn),NM('',ST.rateIn),NM('',ST.rateIn),NM('',ST.rateIn),TX('')]));
  const sheet=worksheetXml({rows,cols:[14,40,8,12,12,12,13,13,20],freeze:1,first:true,
    filter:'A1:I'+rows.length,footL:'BidEst rate list template',footR:'Rates'});
  const notes=worksheetXml({cols:[100],rows:[
    [TX('How to fill in the BidEst rate list',ST.bold)],
    [TX('• One row per rate. Keep the header names in row 1 — the app matches columns by name.')],
    [TX('• CSI code is required. Bill items are priced on an exact code match first, then the longest matching code prefix (e.g. 03 30 00 prices every 03 30 xx item).')],
    [TX('• Enter either a Total rate, or the Labour / Material / Plant / Subcontract components — the total is used when both are given.')],
    [TX('• Rates exclude waste: waste % is added in the app from the project conventions.')],
    [TX('• Add as many rows as you need, and delete the ones you do not use.')]],footL:'BidEst rate list template',footR:'Notes'});
  const bytes=packXlsx([['Rates',sheet],['Notes',notes]]);
  deliver('BidEst_rate_list_template.xlsx',new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function packXlsx(sheets){

    '<sheets>'+names.map((n,i)=>'<sheet name="'+xesc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets>'+
    (sheets[0][1].indexOf('<autoFilter')>=0?'<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'+
      xesc(names[0])+'!$A$1:$I$1</definedName></definedNames>':'')+'</workbook>';
  const wbRels=X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    names.map((n,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '<Relationship Id="rId'+(names.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const ct=X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    names.map((n,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>';
  const rels=X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  return zipStore([['[Content_Types].xml',ct],['_rels/.rels',rels],['xl/workbook.xml',wb],
    ['xl/_rels/workbook.xml.rels',wbRels],['xl/styles.xml',STYLES_XML]]

  if(rebarEst.length)out.push({sec:'Reinforcement',risk:'Reinforcement on '+rebarEst.length+' items derived from assumed kg/m³ densities rather than a bar schedule.',imp:'H',act:'Obtain the bar bending schedules and re-measure before the bid is submitted.'});
  const scaled=est.filter(i=>i.flags.indexOf('scaled')>=0);
  if(scaled.length)out.push({sec:'Scaled quantities',risk:scaled.length+' items measured by scaling a drawing rather than from a dimension.',imp:'M',act:'Confirm the critical dimensions against a dimensioned drawing or a survey.'});
  const prov=est.filter(i=>i.flags.indexOf('prov')>=0);
  if(prov.length)out.push({sec:'Services',risk:'MEP measured as an allowance on gross floor area pending services design.',imp:'H',act:'Convert to measured work or a firm provisional sum once the services drawings are issued.'});
  const D=derivedLevels();
  if(D.Hexc!==null&&D.Hexc>2)out.push({sec:'Substructure',risk:'Excavation exceeds the 2.00 m depth band assumed in the item descriptions.',imp:'M',act:'Split excavation and earthwork support into NRM2 depth bands.'});
  if(nn(P.levels.GWT)!==null&&D.BOB!==null&&nn(P.levels.GWT)>D.BOB)out.push({sec:'Substructure',risk:'Ground water above formation level — dewatering and tanking are cost-significant and weakly defined.',imp:'H',act:'Price dewatering on a measured basis from a geotechnical report.'});
  if(!P.levels.siteArea)out.push({sec:'Site works',risk:'Site area not entered, so site clearance and reduced level excavation are unmeasured.',imp:'M',act:'Take the site area off the site plan and re-run the take-off.'});
  if(/Prelim|50%|Preliminary/i.test(P.meta.status))out.push({sec:'Drawing status',risk:'Take-off is based on drawings marked "'+P.meta.status+'" — quantities will move before construction issue.',imp:'H',act:'Carry a design development allowance and re-measure at tender issue.'});
  const e=estimate(res);
  if(e.unpriced)out.push({sec:'Pricing',risk:e.unpriced+' bill items carry no rate, so the tender total understates the cost.',imp:'H',act:'Extend the price library or price the outstanding items by hand.'});
  if(!P.openings.length&&P.rooms.length)out.push({sec:'Finishes',risk:'No door or window schedule, so no openings have been deducted from wall areas or finishes.',imp:'M',act:'Import the door and window schedule before relying on wall and finish quantities.'});
  return out;
}
/* ---------- quantified risk calculator (NRM2 'Risks' + NRM1 risk-allowance method) ---------- */
const RISK_CATS=[{v:'',t:'—'},{v:'DD',t:'Design development'},{v:'CN',t:'Construction'},
  {v:'EC',t:'Employer change'},{v:'EO',t:'Employer other'},{v:'CM',t:'Commercial / contractual'}];
const RISK_OWN=[{v:'C',t:'Transferred to contractor'},{v:'E',t:'Retained by employer'},{v:'S',t:'Shared'}];
const RISK_CONF=[{v:'EMV',t:'Expected value (EMV)'},{v:'P50',t:'P50'},{v:'P80',t:'P80'},{v:'P90',t:'P90'}];
const RISK_MODE=[{v:'pct',t:'Contingency % only (register not priced)'},
  {v:'register',t:'Quantified register replaces contingency %'},
  {v:'both',t:'Quantified register plus contingency %'}];
const pBand=p=>p===null?null:p<10?1:p<30?2:p<50?3:p<70?4:5;
const iBand=(m,base)=>{if(m===null||!base)return null;const x=m/base*100;
  return x<0.25?1:x<0.5?2:x<1?3:x<2.5?4:5;};
const scoreGrade=s=>s===null?null:s>=15?'H':s>=8?'M':'L';
/* deterministic RNG so the percentiles don't jitter between redraws */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function triInv(u,a,c,b){if(b<=a)return c;const fc=(c-a)/(b-a);
  return u<fc?a+Math.sqrt(u*(b-a)*(c-a)):b-Math.sqrt((1-u)*(b-a)*(b-c));}
function riskRow(r,base){
  const open=(r.status||'O')!=='X';
  const p=nn(r.prob);let ml=nn(r.ml),lo=nn(r.lo),hi=nn(r.hi);
  const quant=open&&p!==null&&(ml!==null||lo!==null||hi!==null);
  if(ml===null)ml=lo!==null&&hi!==null?(lo+hi)/2:(lo!==null?lo:hi);
  if(lo===null)lo=ml;if(hi===null)hi=ml;
  const s=[lo,ml,hi].sort((a,b)=>a-b);[lo,ml,hi]=s;
  const own=r.own||'C';
  const share=own==='C'?1:own==='E'?0:Math.min(1,Math.max(0,(nn(r.share)===null?50:nn(r.share))/100));
  const pp=Math.min(1,Math.max(0,(p||0)/100));
  const mean=quant?(lo+4*ml+hi)/6:null;
  const emv=quant?pp*mean:null;
  const pb=pBand(p),ib=iBand(mean,base);
  const score=(pb&&ib)?pb*ib:null;
  return {r,open,quant,p,pp,lo,ml,hi,mean,emv,share,own,
    cEmv:quant?emv*share:0,eEmv:quant?emv*(1-share):0,pb,ib,score,grade:scoreGrade(score)};
}
let RISK_CACHE={k:null,v:null};
function riskCalc(base){
  const key=JSON.stringify([base,P.risks.map(r=>[r.prob,r.lo,r.ml,r.hi,r.own,r.share,r.status])]);
  if(RISK_CACHE.k===key)return RISK_CACHE.v;
  const rows=P.risks.map(r=>riskRow(r,base));
  const q=rows.filter(x=>x.quant);
  const N=5000,rnd=mulberry(20261011),cT=new Float64Array(N),eT=new Float64Array(N);
  for(let i=0;i<N;i++){let c=0,e=0;
    for(const x of q){const u=rnd(),v=rnd();if(u<x.pp){const amt=triInv(v,x.lo,x.ml,x.hi);c+=amt*x.share;e+=amt*(1-x.share);}}
    cT[i]=c;eT[i]=e;}
  cT.sort();eT.sort();
  const pct=(a,p)=>a.length?a[Math.min(a.length-1,Math.floor(p*a.length))]:0;
  const v={rows,q,N,base,cSorted:cT,
    c:{EMV:sum(q,x=>x.cEmv),P50:pct(cT,.5),P80:pct(cT,.8),P90:pct(cT,.9),max:cT[N-1]||0},
    e:{EMV:sum(q,x=>x.eEmv),P50:pct(eT,.5),P80:pct(eT,.8),P90:pct(eT,.9)},
    unquant:rows.filter(x=>x.open&&!x.quant).length,
    open:rows.filter(x=>x.open).length};
  RISK_CACHE={k:key,v};
  return v;
}
/* grade follows the score once a risk is quantified; manual H/M/L otherwise */
function syncRiskGrades(base){riskCalc(base).rows.forEach(x=>{if(x.grade)x.r.imp=x.grade;});}

const RISK_PROMPTS=[
  ['DD','Design status','Design incomplete at tender — quantities and specification grow on re-measure at construction issue.','C',60,0.5,1.5,3,'Qualify the bid against the tender drawing list; price re-measurement exposure here.'],
  ['CN','Substructure','Ground conditions differ from the geotechnical report (rock, sabkha, soft spots).','S',30,0.3,1,3,'Obtain the soil report; qualify against stated bearing capacity.'],
  ['CN','Substructure','High ground water — dewatering duration and volume exceed allowance.','C',35,0.2,0.6,1.5,'Price dewatering on a measured basis from borehole levels.'],
  ['CN','Programme','Summer midday work ban and heat reduce labour productivity.','C',70,0.2,0.5,1,'Programme concrete pours for night shifts in summer months.'],
  ['CN','Materials','Price escalation on rebar, cement, structural steel and diesel during the contract.','C',50,0.5,1.5,3,'Fix supplier prices or seek a price-adjustment clause.'],
  ['CN','Resources','Labour and visa availability, Saudization quotas delay mobilisation.','C',40,0.2,0.6,1.5,'Confirm manpower plan and visa block before award.'],
  ['CN','Procurement','Long-lead items (steel structure, MEP plant) delivered late.','C',35,0.2,0.7,2,'Place early orders; confirm lead times with suppliers.'],
  ['CN','Approvals','Authority and utility approvals (permits, power connection) delay works.','S',40,0.1,0.4,1,'List approvals in the programme with float; qualify durations.'],
  ['EC','Scope','Employer-instructed variations and scope growth.','E',50,1,3,6,'Retained by employer — valued under the contract; not in the bid price.'],
  ['EO','Site','Late possession of, or restricted access to, the site.','E',25,0.2,0.5,1.5,'Retained by employer — state possession date as a tender qualification.'],
  ['CM','Programme','Liquidated damages from programme overrun.','C',20,0.5,1.5,4,'Check LD rate and cap; build float into the tender programme.'],
  ['CM','Cash flow','Delayed interim payments raise financing cost.','C',30,0.2,0.5,1,'Check payment terms; price finance cost on the S-curve.']
];
function addRiskPrompts(base){
  const r1k=v=>base?Math.round(base*v/100/1000)*1000:'';
  let n=0;
  RISK_PROMPTS.forEach(([cat,sec,risk,own,prob,lo,ml,hi,act])=>{
    if(P.risks.some(x=>x.risk===risk))return;
    P.risks.push({id:uid('r'),cat,sec,risk,own,share:own==='S'?50:'',prob,lo:r1k(lo),ml:r1k(ml),hi:r1k(hi),act,imp:'M',status:'O'});n++;});
  touch();
  toast(n?n+' risk prompts added'+(base?' — amounts scaled to measured work; replace with your own judgement':' — no priced work yet, so amounts are blank'):'Prompts already in the register',4200);
}

function riskHeat(rc){
  const grid={};rc.rows.forEach(x=>{if(x.open&&x.score){const k=x.pb+'-'+x.ib;grid[k]=(grid[k]||0)+1;}});
  const cell=(p,i)=>{const s=p*i,c=grid[p+'-'+i]||0,
    bg=s>=15?'var(--crit-soft)':s>=8?'var(--warn-soft)':'var(--good-soft)',
    fg=s>=15?'var(--crit)':s>=8?'var(--warn)':'var(--good)';
    return el('td',{style:'text-align:center;height:38px;background:'+bg+';color:'+fg+';border:1px solid var(--surface);font-family:var(--f-num);font-weight:'+(c?700:400)},c?String(c):'·');};
  const pl=['','<10%','10–30%','30–50%','50–70%','≥70%'],il=['','<0.25%','0.25–0.5%','0.5–1%','1–2.5%','≥2.5%'];
  return el('div',{},el('table',{style:'table-layout:fixed;font-size:11px'},
    el('tbody',{},[5,4,3,2,1].map(p=>el('tr',{},el('td',{class:'hint',style:'width:64px;text-align:right;padding-right:8px'},pl[p]),[1,2,3,4,5].map(i=>cell(p,i)))),
      el('tr',{},el('td',{}),[1,2,3,4,5].map(i=>el('td',{class:'hint',style:'text-align:center;font-size:10px;padding-top:4px'},il[i]))))),
    el('div',{class:'hint',style:'margin-top:6px'},'Rows: probability. Columns: impact (PERT mean) as % of measured work. Score = band × band; 15+ high, 8–14 medium.'));
}
function riskCurve(rc,conf){
  const a=rc.cSorted,N=a.length,mx=a[N-1]||0;
  if(!rc.q.length||mx<=0)return emptyState('No distribution yet','Give at least one contractor-owned risk a probability and an impact.');
  const W=640,H=220,L=58,R=14,T=12,B=34,iw=W-L-R,ih=H-T-B;
  const X=v=>L+v/mx*iw,Y=p=>T+ih-p*ih;
  const bins=24,cnt=new Array(bins).fill(0);
  for(let i=0;i<N;i++)cnt[Math.min(bins-1,Math.floor(a[i]/mx*bins))]++;
  const cm=Math.max(...cnt)||1;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Distribution of contractor risk exposure">';
  for(let g=0;g<=4;g++){const y=Y(g/4);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line2)"/>'+
    '<text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="var(--ink3)" font-family="var(--f-num)">'+(g*25)+'%</text>';}
  cnt.forEach((c,i)=>{const x0=L+i/bins*iw,bw=iw/bins-1,h=c/cm*ih*.55;
    s+='<rect x="'+x0+'" y="'+(T+ih-h)+'" width="'+Math.max(1,bw)+'" height="'+h+'" fill="var(--accent-soft)"/>';});
  let d='';const step=Math.max(1,Math.floor(N/200));
  for(let i=0;i<N;i+=step)d+=(d?'L':'M')+X(a[i]).toFixed(1)+','+Y((i+1)/N).toFixed(1);
  d+='L'+X(mx).toFixed(1)+','+Y(1).toFixed(1);
  s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  [['P50',.5],['P80',.8],['P90',.9]].forEach(([k,p])=>{const v=rc.c[k],x=X(v),on=k===conf;
    s+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(p)+'" y2="'+(T+ih)+'" stroke="'+(on?'var(--crit)':'var(--ink3)')+'" stroke-dasharray="3 3"/>'+
      '<circle cx="'+x+'" cy="'+Y(p)+'" r="3.5" fill="'+(on?'var(--crit)':'var(--ink2)')+'"/>'+
      '<text x="'+(x-5)+'" y="'+(Y(p)-6)+'" text-anchor="end" font-size="10.5" font-weight="600" fill="'+(on?'var(--crit)':'var(--ink2)')+'" font-family="var(--f-num)">'+k+'</text>';});
  [0,.25,.5,.75,1].forEach(t=>{s+='<text x="'+X(mx*t)+'" y="'+(H-14)+'" text-anchor="middle" font-size="10" fill="var(--ink3)" font-family="var(--f-num)">'+
    (mx*t>=1e6?(mx*t/1e6).toFixed(2)+'M':(mx*t/1e3).toFixed(0)+'k')+'</text>';});
  s+='<text x="'+(L+iw/2)+'" y="'+(H-1)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">Contractor risk exposure, '+esc(CUR())+' — '+rc.N.toLocaleString()+' Monte Carlo iterations</text></svg>';
  return el('div',{html:s});
}

function vRisk(){
  const w=el('div',{class:'stack'});
  const res=RES||compute();
  const auto=autoRisks();
  const C=P.commercial,base=estimate(res).measured;
  syncRiskGrades(base);
  const rc=riskCalc(base),mode=C.riskMode||'pct',conf=C.riskConf||'P80';
  w.append(head('Stage 14','Risk calculator, assumptions and exclusions',
    'Each risk is owned, given a probability and a three-point impact, and valued. Risks transferred to the contractor are priced — the NRM2 "Risks" section of the bill — and risks the employer retains are listed as qualifications, not priced.',
    [el('button',{class:'btn',onclick:()=>addRiskPrompts(base)},'Add KSA risk prompts'),
     el('button',{class:'btn',onclick:()=>{auto.forEach(r=>{
      if(!P.risks.some(x=>x.risk===r.risk))P.risks.push(Object.assign({id:uid('r'),own:'C',status:'O'},r));});
      touch();toast(auto.length+' detected risks added');}},'Add detected risks')]));

  const e=estimate(res);

    tile('Contractor risk — EMV',money(rc.c.EMV),base?f(rc.c.EMV/base*100,2)+'% of measured work':CUR()),

    tile('Open risks',rc.open,rc.rows.filter(x=>x.open&&x.r.imp==='H').length+' high · '+rc.unquant+' not quantified')));

  if(rc.unquant)w.append(el('div',{class:'flag wn'},el('div',{},el('b',{},rc.unquant+' open risk'+(rc.unquant===1?' has':'s have')+' no probability or impact. '),
    'They are carried in the register but add nothing to the allowance.')));

  /* allowance into the estimate */

    el('div',{class:'pad stack'},
      el('div',{class:'grid g3'},
        selField('Allowance method',mode,RISK_MODE,v=>C.riskMode=v),
        selField('Confidence level priced',conf,RISK_CONF,v=>C.riskConf=v),
        fld('Contingency %',C.contingPct,v=>C.contingPct=v,{num:1})),
      el('div',{class:'tw'},el('table',{class:'mini'},el('tbody',{},
        el('tr',{},el('td',{},'Quantified contractor risk at '+conf),el('td',{class:'n'},money(rc.c[conf])),
          el('td',{class:'hint'},mode==='pct'?'not in total':'in total')),
        el('tr',{},el('td',{},'General contingency at '+num(C.contingPct)+'%'),el('td',{class:'n'},money(contPctVal)),
          el('td',{class:'hint'},mode==='register'?'not in total':'in total')),
        el('tr',{class:'tot'},el('td',{},'Risk and contingency carried'),el('td',{class:'n'},money(e.cont+e.riskAllow)),
          el('td',{class:'hint'},e.total?f((e.cont+e.riskAllow)/e.total*100,2)+'% of tender total':'')),
        el('tr',{},el('td',{},'Tender total'),el('td',{class:'n'},money(e.total)),el('td',{class:'hint'},CUR()))))),
      el('div',{class:'hint'},'P80 means an 80% chance the contractor-owned risks cost no more than the allowance. Enter impacts at tender price level — the allowance is added after overheads, profit and inflation, alongside contingency.'))));

  /* identification */
  w.append(card('1 · Risk register','Identify, categorise and assign ownership',
    el('div',{class:'pad'},schedule(P.risks,[
      {k:'sec',t:'Item / section',w:130},
      {k:'risk',t:'Risk'},
      {k:'cat',t:'Category',type:'sel',w:150,opts:RISK_CATS},
      {k:'own',t:'Owner',type:'sel',w:170,opts:RISK_OWN},
      {k:'act',t:'Response / mitigation'},
      {k:'status',t:'Status',type:'sel',w:90,opts:[{v:'O',t:'Open'},{v:'X',t:'Closed'}]}
    ],{blank:()=>({id:uid('r'),imp:'M',own:'C',status:'O'}),emptyHint:'Add the KSA prompts or the detected risks, then edit them to this project.'}))));

  /* quantification */
  const qtab=el('table',{});
  qtab.append(el('thead',{},el('tr',{},
    ['#','Risk','Owner','Contractor share %','Probability %','Min','Most likely','Max','PERT mean','EMV','Contractor EMV','Score'].map((h,i)=>
      el('th',{class:i>2?'n':''},h)))));
  const qb=el('tbody',{});
  const inp=(row,k,ph,dis)=>{const i=el('input',{value:row[k]===null||row[k]===undefined?'':row[k],class:'num',
      placeholder:ph||'',style:'text-align:right;min-width:78px',disabled:dis?'disabled':null});
    i.addEventListener('change',ev=>{row[k]=ev.target.value;touch();});return el('td',{},i);};
  rc.rows.forEach((x,i)=>{const r=x.r;
    qb.append(el('tr',{style:x.open?'':'opacity:.5'},
      el('td',{class:'hint num'},String(i+1)),
      el('td',{style:'min-width:260px;max-width:360px;font-size:12px;line-height:1.35'},(r.risk||'(no description)')+(x.open?'':' — closed')),
      el('td',{},el('span',{class:'chip '+(x.own==='C'?'ac':x.own==='E'?'':'wn')},x.own==='C'?'Contractor':x.own==='E'?'Employer':'Shared')),
      inp(r,'share',x.own==='S'?'50':'',x.own!=='S'),
      inp(r,'prob','%'),inp(r,'lo'),inp(r,'ml'),inp(r,'hi'),
      el('td',{class:'n'},x.quant?money(x.mean):'—'),
      el('td',{class:'n'},x.quant?money(x.emv):'—'),
      el('td',{class:'n',style:'font-weight:600'},x.quant?money(x.cEmv):'—'),
      el('td',{class:'n'},x.score?el('span',{class:'chip '+(x.grade==='H'?'cr':x.grade==='M'?'wn':'ok')},x.score+' · '+x.grade):el('span',{class:'hint'},r.imp||'—'))));
  });
  if(rc.rows.length)qb.append(el('tr',{class:'tot'},el('td',{}),el('td',{},'Totals'),el('td',{colspan:7}),
    el('td',{class:'n'},money(rc.c.EMV+rc.e.EMV)),el('td',{class:'n'},money(rc.c.EMV)),el('td',{})));
  qtab.append(qb);
  w.append(card('2 · Quantification','Probability × three-point impact (PERT mean = (min + 4 × most likely + max) ÷ 6)',
    el('div',{class:'pad'},rc.rows.length?el('div',{class:'tw'},qtab):emptyState('No risks to quantify','Add risks in the register first.'),
      el('div',{class:'hint',style:'margin-top:8px'},'EMV = probability × PERT mean. Amounts in '+CUR()+'. Shared risks split by the contractor share; employer-retained risks carry no contractor EMV. Once quantified, the impact grade follows the score.'))));

  /* analysis */
  const top=rc.q.filter(x=>x.cEmv>0).sort((a,b)=>b.cEmv-a.cEmv).slice(0,8),tmax=top.length?top[0].cEmv:1;
  w.append(el('div',{class:'grid g2'},
    card('3 · Heat map','Open, quantified risks',el('div',{class:'pad'},riskHeat(rc))),
    card('4 · Largest contractor exposures','By contractor EMV',el('div',{class:'pad'},top.length?el('div',{class:'stack',style:'gap:8px'},
      top.map(x=>el('div',{},el('div',{class:'row',style:'justify-content:space-between;font-size:12px'},
        el('span',{style:'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},(x.r.sec?x.r.sec+' — ':'')+x.r.risk),
        el('span',{class:'num'},money(x.cEmv))),
        el('div',{class:'bar'},el('i',{style:'width:'+(x.cEmv/tmax*100).toFixed(1)+'%;background:var(--accent)'}))))):
      emptyState('Nothing quantified yet','Contractor-owned risks with a probability and impact appear here.')))));
  w.append(card('5 · Confidence curve','Cumulative probability of contractor risk cost — the chosen confidence level is marked',
    el('div',{class:'pad'},riskCurve(rc,conf))));

  w.append(el('div',{class:'grid g2'},
    card('Assumptions','Stated judgment calls, not measured facts',
      el('div',{class:'pad'},schedule(P.assumptions,[{k:'text',t:'Assumption'}],
        {blank:()=>({text:''}),emptyHint:'Every dimension you took on judgment belongs here.'}))),
    card('Exclusions','What the price does not cover',
      el('div',{class:'pad'},schedule(P.exclusions,[{k:'text',t:'Exclusion'}],
        {blank:()=>({text:''}),
         extra:el('button',{class:'btn sm',onclick:()=>{
           ['Mechanical, electrical and plumbing installations','External works and landscaping beyond the building footprint',
            'Statutory fees, permits and utility connection charges','Loose furniture, fittings and equipment',
            'Temporary works design','Value added tax'].forEach(t=>{
              if(!P.exclusions.some(x=>x.text===t))P.exclusions.push({text:t});});
           touch();}},'Add standard exclusions'),
         emptyHint:'Standard NRM2 exclusions are one click away.'})))));

  if(res.assume.length)w.append(card('Notes raised by the engine',null,
    el('div',{class:'pad stack'},res.assume.slice(0,30).map(a=>el('div',{class:'flag ac'},el('div',{},a))))));
  return w;
}

const CRCT=(()=>{const t=new Uint32Array(256);

  /* ============================ 7. TAKE-OFF ============================ */
  const toCols=[10,20,16,86];

  abstractRows(res,std).forEach(g=>{

      {v:Math.round(it.qty*1000)/1000,s:it.unit==='nr'?ST.num0:ST.qty}]}));

  push('Abstract',{cols:abCols,rows:ab,merges:abMerge,freeze:4,landscape:true,tab:'1D6B4C',

  /* ============================ 9. BOQ ============================ */
  push('BOQ',{cols:bqCols,rows:bq,merges:bqMerge,freeze:4,tab:'26356B',printTitles:'$1:$4'});

  /* ============================ 10. RATES ============================ */
  if((P.rateBook||[]).length){
    const rtCols=[15,54,8,13,13,13,13,15];

    rt.push({h:30,c:[{v:'PRICE LIBRARY',s:ST.banner}].concat(Array(7).fill({v:'',s:ST.banner}))});
    rtMerge.push('A1:H1');
    rt.push({h:17,c:[{v:'Coded to CSI MasterFormat · all rates in '+CURC,s:ST.subbanner}]
      .concat(Array(7).fill({v:'',s:ST.subbanner}))});
    rtMerge.push('A2:H2');
    rt.push([]);
    rt.push({h:26,c:[{v:'CSI code',s:ST.hdrL},{v:'Description',s:ST.hdrL},{v:'Unit',s:ST.hdr},

        nn(r.total)!==null?{v:num(r.total),s:ST.moneyB}:FM('SUM(D'+rn+':G'+rn+')',ST.moneyB)]);
    });
    push('Rates',{cols:rtCols,rows:rt,merges:rtMerge,freeze:4,tab:'4A5064',
      filter:'A4:H'+Math.max(4,rt.length)});
  }

  /* ============================ assemble ============================ */
  const names=SH.map(s=>s[0]);
  const sheets=SH.map(s=>worksheetXml(s[1]));
  const defNames=SH.map((s,i)=>s[1].printTitles
    ? '<definedName name="_xlnm.Print_Titles" localSheetId="'+i+'">\''+s[0].replace(/'/g,"''")+'\'!'+s[1].printTitles+'</definedName>'

    '<sheets>'+names.map((n,i)=>'<sheet name="'+xesc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets>'+
    (defNames?'<definedNames>'+defNames+'</definedNames>':'')+
    '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

    names.map((n,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '<Relationship Id="rId'+(names.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+

  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
    names.map((n,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
    '</Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+

    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'+
    '</Relationships>';
  const core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" '+
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" '+
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'+
    '<dc:title>'+xesc((M.name||'Bill of Quantities')+' — Bill of Quantities')+'</dc:title>'+

async function deliver(filename,data){
  if(!DL){try{DL=await claude.use('downloads');}catch(e){DL=null;}}
  if(DL){
    try{await DL.save({filename,data});toast('Saved '+filename);return;}
    catch(err){
      if(err&&err.code==='declined'){toast('Download cancelled');return;}
      toast('Could not save the file: '+((err&&err.message)||'unknown error'));return;
    }
  }
  toast('Downloads are not available in this browser.');
}
async function exportXLSX(){
  try{
    const bytes=buildWorkbook();
    const name=(P.meta.code||P.meta.name||'BidEst').replace(/[^\w\-]+/g,'_')+'_BOQ_'+P.meta.standard+'.xlsx';
    await deliver(name,new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(e){toast('Export failed: '+e.message);}
}
function csvEsc(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
async function exportCSV(which){
  const res=RES||compute(),std=P.meta.standard,L=[];
  let name='';
  if(which==='dimensions'){
    name='dimension_sheet.csv';
    L.push(['Group','Times','Dimensions','Squaring','Description'].map(csvEsc).join(','));
    res.items.forEach(it=>{
      it.terms.forEach((t,i)=>L.push([i===0?it.group:'',t.times!==1?t.times:'',
        t.dims.map(d=>f(d,3)).join(' x '),t.val.toFixed(4),i===0?it.desc:(t.lab||'')].map(csvEsc).join(',')));
      L.push(['','','Total',it.qty.toFixed(4),unitLabel(it.unit)+' — '+it.desc].map(csvEsc).join(','));
    });
  }else{
    name='bill_of_quantities_'+std+'.csv';
    L.push(['Ref','Code','Section / description','Unit','Quantity','Rate','Amount'].map(csvEsc).join(','));
    boqRows(res,std).forEach(r=>{
      if(r.sec)L.push([r.ref,r.code||'',r.name,'','','',''].map(csvEsc).join(','));
      else L.push([r.ref,r.code,r.desc,unitLabel(r.unit),r.qty.toFixed(3),
        r.rate===null?'':r.rate.toFixed(2),r.amount===null?'':r.amount.toFixed(2)].map(csvEsc).join(','));
    });
  }
  await deliver((P.meta.code||'BidEst').replace(/[^\w\-]+/g,'_')+'_'+name,'﻿'+L.join('\n'));
}

let AUTO={timer:null,busy:false,at:null,err:null,on:true};

/* ---------- store helpers ---------- */
function projPayload(){return JSON.stringify(P,typeof tkStripReplacer==='function'?tkStripReplacer:undefined);}
function projMeta(){return {name:P.meta.name||'Untitled project',code:P.meta.code||'',
  standard:P.meta.standard,client:P.meta.client||'',updated:new Date().toISOString()};}
function stripQuantities(src){
  const t=clone(src);
  ['footings','necks','columns','beams','slabs','rcwalls','stairs','steel','walls','rooms',
   'openings','roofs','joinery','sanitary','mep','ext','custom','measures','risks'].forEach(k=>t[k]=[]);
  t.manualRates={};
  if(t.tk)t.tk={v:1,sheets:[],traces:[],asms:t.tk.asms||[],groups:(t.tk.groups||[]).map(g=>Object.assign({},g,{hidden:false}))};
  t.meta=Object.assign({},t.meta,{name:'',code:'',client:'',date:today(),rev:'A',drawings:''});
  t.levels=Object.assign({},t.levels,{NGL:null,FGL:null,BOF:null,GWT:null,siteArea:null,
    floors:(t.levels.floors||[]).map(x=>Object.assign({},x,{gfa:''}))});
  return t;
}

async function saveProject(silent){
  const db=await getDB();
  if(!db){if(!silent)toast('Saving is not available in this view — export the workbook instead.');return false;}
  const id=SAVED.id||uid('p');
  if(typeof tkBeforeSave==='function'){
    try{await tkBeforeSave(db,id);}
    catch(e){AUTO.err=(e&&(e.code||e.message))||'failed';if(!silent)toast('Saving the take-off failed: '+AUTO.err);renderNav();return false;}
  }
  const payload=projPayload();
  if(payload.length>240000){
    AUTO.err='too large';
    if(!silent)toast('This project is '+Math.round(payload.length/1024)+' KB — over the 240 KB limit for one document. Move the price library to the shared library, or export the workbook.');
    return false;
  }
  try{
    await db.doc('projects/'+id).set(Object.assign(projMeta(),{kind:'project',bytes:payload.length,data:payload}));
    SAVED={id:id,name:P.meta.name||'Untitled project',dirty:false};
    AUTO.at=new Date();AUTO.err=null;
    if(!silent)toast('Saved “'+SAVED.name+'”');
    renderNav();
    return true;
  }catch(e){
    AUTO.err=(e&&(e.code||e.message))||'failed';
    if(!silent)toast('Save failed: '+AUTO.err);
    renderNav();
    return false;
  }
}
function scheduleAutosave(){
  if(!AUTO.on)return;
  clearTimeout(AUTO.timer);
  AUTO.timer=setTimeout(async()=>{
    if(!SAVED.dirty||AUTO.busy)return;
    if(!SAVED.id&&!(P.meta.name||'').trim())return;   /* don't create junk records for an untouched project */
    AUTO.busy=true;renderNav();
    await saveProject(true);
    AUTO.busy=false;renderNav();
  },2500);
}
function saveStatus(){
  if(!AUTO.on)return {cls:'',txt:'Autosave off'};
  if(AUTO.busy)return {cls:'ac',txt:'Saving…'};
  if(AUTO.err)return {cls:'cr',txt:'Not saved'};
  if(SAVED.dirty)return {cls:'wn',txt:'Pending'};
  if(AUTO.at)return {cls:'ok',txt:'Saved '+AUTO.at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
  return {cls:'',txt:'Not saved yet'};
}
async function listStore(kind){
  const db=await getDB();
  if(!db)return null;
  try{
    const snap=await db.collection('projects').orderBy('updated','desc').limit(1000).get();
    return snap.docs.map(d=>Object.assign({id:d.id},d.data()))
      .filter(r=>kind?((r.kind||'project')===kind):true);
  }catch(e){return [];}
}
function openStored(r){
  let obj;
  try{obj=JSON.parse(r.data);}catch(e){toast('That record could not be read.');return;}
  P=Object.assign(blankProject(),obj);
  SAVED={id:r.id,name:r.name,dirty:false};
  AUTO.at=new Date(r.updated);AUTO.err=null;
  tab={};DXF=null;PDFS={doc:null,page:1,pages:0,mPerUnit:null,tool:'cal',pts:[],zoom:1.4,name:'',auto:null};
  if(typeof tkAfterOpen==='function')tkAfterOpen(r.id);
  closeModal();view='project';render();window.scrollTo(0,0);
  toast('Opened “'+r.name+'”');
}

  const db=await getDB();
  if(!db){toast('Saving is not available in this view.');return;}
  const nameI=el('input',{value:(P.meta.name?P.meta.name+' — standard':'House standard'),placeholder:'Template name'});

  openModal('Save as a template',
    el('div',{class:'stack'},
      el('p',{class:'hint',style:'margin:0'},
        'A template keeps your levels, measurement conventions, reinforcement densities, standard, currency and exclusions. Every measured quantity is cleared, so a new job starts from it empty.'),
      el('label',{class:'f'},el('span',{},'Template name'),nameI),
      el('label',{class:'row',style:'gap:8px'},keepRates,el('span',{},'Include the price library in the template'))),
    [el('button',{class:'btn pri',onclick:async()=>{
      const t=stripQuantities(P);
      if(!keepRates.checked)t.rateBook=[];
      const payload=JSON.stringify(t);
      try{
        await db.doc('projects/'+uid('t')).set({kind:'template',name:nameI.value||'Template',
          code:'',standard:P.meta.standard,client:'',updated:new Date().toISOString(),
          bytes:payload.length,data:payload});
        closeModal();toast('Template saved');
      }catch(e){toast('Could not save the template: '+(e.code||e.message));}
    }},'Save template'),el('button',{class:'btn',onclick:closeModal},'Cancel')]);
  setTimeout(()=>nameI.focus(),60);
}

/* ---------- the project browser ---------- */
let PICKQ='';
async function openProjectPicker(startTab){
  const all=await listStore(null);
  if(all===null){
    openModal('Projects',el('div',{class:'empty'},

  }
  let which=startTab||'project';
  const body=el('div',{});

    body.innerHTML='';
    const rows=all.filter(r=>(r.kind||'project')===which)

    const q=el('input',{placeholder:'Search by name, job number or client',value:PICKQ,style:'max-width:320px'});
    q.addEventListener('input',e=>{PICKQ=e.target.value;draw();setTimeout(()=>{const n=$('input',body);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},0);});

      el('div',{class:'spacer'}),
      el('span',{class:'hint'},rows.length+' shown of '+all.filter(r=>(r.kind||'project')===which).length)));
    if(!rows.length){
      body.append(el('div',{class:'empty'},
        el('b',{},which==='template'?'No templates yet':'Nothing saved yet'),
        which==='template'
          ? 'Set up a project the way your office works, then use “Save as template” to reuse it.'
          : 'Projects save themselves a few seconds after you stop typing.'));
      return;
    }
    body.append(el('div',{class:'tw',style:'max-height:56vh'},el('table',{},
      el('thead',{},el('tr',{},[which==='template'?'Template':'Project','Job no.','Client','Standard','Last saved','Size','']
        .map(h=>el('th',{},h)))),
      el('tbody',{},rows.map(r=>el('tr',{},
        el('td',{style:'font-weight:600'},r.name||'Untitled'),
        el('td',{class:'num'},r.code||''),
        el('td',{class:'hint'},r.client||''),
        el('td',{},el('span',{class:'chip ac'},r.standard||'')),
        el('td',{class:'hint'},new Date(r.updated).toLocaleString()),
        el('td',{class:'n hint'},Math.round((r.bytes||0)/1024)+' KB'),
        el('td',{},el('div',{class:'row',style:'flex-wrap:nowrap;gap:3px'},
          which==='template'
            ? el('button',{class:'btn sm pri',onclick:()=>{
                let obj;try{obj=JSON.parse(r.data);}catch(e){toast('That template could not be read.');return;}
                P=Object.assign(blankProject(),obj);
                SAVED={id:null,name:'',dirty:true};AUTO.at=null;
                closeModal();view='project';render();
                toast('New project started from “'+r.name+'”');
              }},'Use')
            : el('button',{class:'btn sm pri',onclick:()=>openStored(r)},'Open'),
          el('button',{class:'btn sm',title:'Copy this record to a new one',onclick:async()=>{
            const db=await getDB();if(!db)return;
            try{
              await db.doc('projects/'+uid(which==='template'?'t':'p')).set(Object.assign({},r,
                {id:undefined,name:(r.name||'Untitled')+' (copy)',updated:new Date().toISOString()}));
              closeModal();toast('Copied — reopen the list to see it');
            }catch(e){toast('Copy failed: '+(e.code||e.message));}
          }},'Copy'),
          which==='project'?el('button',{class:'btn sm',title:'Bring this project’s rates into the one you have open',
            onclick:()=>{
              let obj;try{obj=JSON.parse(r.data);}catch(e){return;}
              const inc=(obj.rateBook||[]);
              if(!inc.length){toast('That project has no rates.');return;}
              const have={};(P.rateBook||[]).forEach(x=>have[normCode(x.code)]=x);
              let added=0,updated=0;
              inc.forEach(x=>{const k=normCode(x.code);
                if(!k)return;
                if(have[k]){Object.assign(have[k],x);updated++;}
                else{P.rateBook.push(clone(x));added++;}});
              closeModal();touch();
              toast(added+' rates added, '+updated+' updated from “'+r.name+'”');
            }},'Take rates'):null,
          el('button',{class:'btn sm dgr',onclick:()=>askConfirm('Delete',
            'Delete “'+r.name+'” permanently? This cannot be undone.','Delete',async()=>{

/* ---------- shared price library ---------- */
const LIB_PAGE=600;
async function loadSharedRates(force){
  if(LIB.loaded&&!force)return LIB.rates;
  const db=await getDB();
  if(!db)return null;
  const out=[];
  try{
    for(let i=0;i<12;i++){
      const s=await db.doc('library/rates_'+i).get();
      if(!s.exists)break;
      const d=s.data()||{};
      (d.rates||[]).forEach(r=>out.push(r));
      if(!d.more)break;
    }
    LIB.rates=out;LIB.loaded=true;
    return out;
  }catch(e){return null;}
}
async function saveSharedRates(rates){
  const db=await getDB();
  if(!db){toast('The shared library needs the online store, which is not available in this view.');return false;}
  LIB.busy=true;
  try{
    const pages=Math.max(1,Math.ceil(rates.length/LIB_PAGE));
    for(let i=0;i<pages;i++){
      await db.doc('library/rates_'+i).set({rates:rates.slice(i*LIB_PAGE,(i+1)*LIB_PAGE),
        more:i<pages-1,updated:new Date().toISOString(),count:rates.length});
    }
    for(let i=pages;i<pages+4;i++){try{await db.doc('library/rates_'+i).delete();}catch(e){}}
    LIB.rates=rates;LIB.loaded=true;LIB.busy=false;
    return true;
  }catch(e){LIB.busy=false;toast('Could not write the shared library: '+(e.code||e.message));return false;}
}
function mergeRates(into,from){
  const have={};into.forEach(x=>{const k=normCode(x.code);if(k)have[k]=x;});
  let added=0,updated=0;
  from.forEach(x=>{const k=normCode(x.code);if(!k)return;
    if(have[k]){Object.assign(have[k],x);updated++;}else{into.push(clone(x));added++;}});
  return {added,updated};
}
async function pushToShared(){
  const cur=await loadSharedRates();
  const base=(cur||[]).slice();
  const r=mergeRates(base,P.rateBook||[]);
  if(await saveSharedRates(base))
    toast('Shared library now holds '+base.length+' rates — '+r.added+' added, '+r.updated+' updated');
  render();
}
async function pullFromShared(){
  const cur=await loadSharedRates(true);
  if(cur===null){toast('The shared library is not reachable in this view.');return;}
  if(!cur.length){toast('The shared library is empty — send this project’s rates to it first.');return;}
  const r=mergeRates(P.rateBook,cur);
  touch();
  toast(r.added+' rates added, '+r.updated+' updated from the shared library');
}

/* ==========================================================================
   DXF → schedules, by layer naming convention
   ========================================================================== */
const LAYER_RULES=[
  {t:'Rooms',              re:'room|space|area|rm(-|_|$)|a-area',                act:'rooms'},
  {t:'External walls',     re:'wall.*ext|ext.*wall|a-wall-extr|ew(-|_|$)',       act:'wall-ext'},
  {t:'Internal walls',     re:'wall|part|partition|a-wall|iw(-|_|$)|blockwork',  act:'wall-int'},
  {t:'Columns',            re:'col|column|s-col|a-col',                          act:'columns'},
  {t:'Doors',              re:'door|a-door|dr(-|_|$)',                           act:'doors'},
  {t:'Windows',            re:'window|glaz|a-glaz|wd(-|_|$)',                    act:'windows'},
  {t:'Slab / floor edge',  re:'slab|floor|s-slab',                               act:'slab'},
  {t:'Foundations',        re:'found|footing|pad|s-fnd',                         act:'footings'},
  {t:'Ignore',             re:'dim|text|hatch|grid|title|anno|defpoints|centre|center|hidden',act:''}
];
function classifyLayer(name){
  const n=String(name||'').toLowerCase();
  for(const r of LAYER_RULES)if(new RegExp(r.re,'i').test(n))return r;
  return null;
}
function applyDxfLayer(lay,act,scale){
  const shapes=(DXF.shapes||[]).filter(s=>s.layer===lay.name);
  const lvl=(floors()[0]||{}).key||'';
  const S=scale;
  let n=0;
  const polys=shapes.filter(s=>s.closed&&s.area*S*S>=2&&s.area*S*S<=400);
  if(act==='rooms'){
    polys.forEach((s,i)=>{P.rooms.push({name:'Room '+(P.rooms.length+1),nr:1,level:lvl,
      area:Math.round(s.area*S*S*100)/100,perim:Math.round(s.len*S*100)/100,
      floorFin:'tile',wallFin:'plaster+paint',ceilFin:'gyp',skirt:'y'});n++;});
    if(n)P.assumptions.push({text:'Room areas and girths taken from closed polylines on CAD layer “'+lay.name+'”; finishes assumed and to be confirmed against the finishes schedule.'});
  }else if(act==='wall-ext'||act==='wall-int'){
    const len=lay.len*S;
    if(len<=0)return 0;
    const ext=act==='wall-ext';
    P.walls.push({mark:(ext?'EW':'IW')+(P.walls.length+1),ext:ext?'y':'n',nr:1,level:lvl,
      type:ext?'ext-block':'int-block',len:Math.round(len*100)/100,t:ext?0.20:0.15,
      finA:ext?'render+paint':'plaster+paint',finB:'plaster+paint',insul:ext?'y':'n'});
    n=1;
    P.assumptions.push({text:'Wall run of '+f(len,2)+' m taken from CAD layer “'+lay.name+'”; wall thickness and height are not held in the drawing geometry and have been assumed — confirm against the sections.'});
  }else if(act==='columns'){
    if(!lay.count)return 0;
    P.columns.push({mark:'C'+(P.columns.length+1),nr:lay.count,level:lvl,shape:'rect',b:'',d:'',rebar:''});
    n=1;
    P.assumptions.push({text:'Column count of '+lay.count+' taken from block inserts on CAD layer “'+lay.name+'”; sizes are not in the block geometry and must be entered from the column schedule.'});
  }else if(act==='doors'||act==='windows'){
    const c=lay.count||polys.length;
    if(!c)return 0;
    const w=act==='doors';
    P.openings.push({mark:(w?'D-':'W-')+String(P.openings.length+1).padStart(2,'0'),
      type:w?'D':'W',nr:c,w:'',h:'',leaves:1,fire:'n',inWall:'',room:'',
      spec:'from CAD layer '+lay.name});
    n=1;
    P.assumptions.push({text:(w?'Door':'Window')+' count of '+c+' taken from block inserts on CAD layer “'+lay.name+'”; sizes must be entered from the '+(w?'door':'window')+' schedule before openings are deducted.'});
  }else if(act==='slab'){
    const a=lay.area*S*S;if(a<=0)return 0;
    P.slabs.push({mark:'S'+(P.slabs.length+1),type:'solid',level:lvl,
      area:Math.round(a*100)/100,perim:Math.round(lay.len*S*100)/100,thk:'',rebar:''});
    n=1;
    P.assumptions.push({text:'Slab area of '+f(a,2)+' m² taken from CAD layer “'+lay.name+'”; thickness to be entered from the structural sections.'});
  }else if(act==='footings'){
    if(!lay.count)return 0;
    P.footings.push({mark:'F'+(P.footings.length+1),nr:lay.count,type:'pad',L:'',W:'',D:''});
    n=1;
    P.assumptions.push({text:'Foundation count of '+lay.count+' taken from CAD layer “'+lay.name+'”; sizes to be entered from the foundation schedule.'});
  }
  return n;
}

}

/* ==========================================================================
   PDF: automatic scale, schedule tables, vector geometry
   ========================================================================== */
function mPerPx(){return PDFS.mPerUnit===null?null:PDFS.mPerUnit/PDFS.zoom;}
async function pdfTextItems(pageNo){
  const page=await PDFS.doc.getPage(pageNo||PDFS.page);
  const tc=await page.getTextContent();
  return tc.items.map(i=>({s:String(i.str||''),x:i.transform[4],y:i.transform[5],
    w:i.width||0,h:Math.abs(i.transform[3])||8}));
}
function detectPlotScale(items){
  const joined=items.map(i=>i.s).join(' ');
  const re=/(?:^|[^0-9])1\s*[:\/]\s*(\d{1,4})(?![0-9])/g;
  const counts={};let m,any=false;
  while((m=re.exec(joined))){
    const d=parseInt(m[1],10);
    if(d>=5&&d<=2000){counts[d]=(counts[d]||0)+1;any=true;}
  }
  if(!any)return null;
  const keys=Object.keys(counts);
  if(!keys.length)return null;
  keys.sort((a,b)=>counts[b]-counts[a]||a-b);
  return parseInt(keys[0],10);
}
/* 1 PDF unit = 1/72 inch on paper; at plot scale 1:S that is 0.0254/72*S metres of building */
const unitMetres=S=>0.0254/72*S;

async function pdfAutoScale(){
  if(!PDFS.doc)return;
  const items=await pdfTextItems();
  const S=detectPlotScale(items);
  if(!S){toast('No “1:100” style scale note found on this sheet — calibrate against a known dimension instead.');return;}
  askConfirm('Scale detected on the sheet',
    'The title block reads 1:'+S+'. If the sheet was plotted to size and has not been resized, one drawing unit is '+
    f(unitMetres(S),4)+' m on the building. Set the scale from that?',
    'Use 1:'+S,()=>{
      PDFS.mPerUnit=unitMetres(S);PDFS.pts=[];PDFS.tool='line';
      P.assumptions.push({text:'Drawing scale taken as 1:'+S+' from the title block of '+PDFS.name+'; quantities scaled from this sheet are approximate.'});
      touch();setTimeout(drawPdfPage,20);
      toast('Scale set from the title block — 1:'+S);
    });
}
/* group text into rows and columns so a schedule table can be read back as a grid */
function textToGrid(items){
  const rows=[];
  items.slice().sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{
    if(!it.s.trim())return;
    const r=rows.find(r=>Math.abs(r.y-it.y)<=Math.max(3,it.h*0.6));
    if(r){r.items.push(it);r.y=(r.y*r.items.length+it.y)/(r.items.length+1);}
    else rows.push({y:it.y,items:[it]});
  });
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x));
}
const TABLE_WORDS=/^(mark|ref|type|qty|quantity|no\.?|nos|nr|width|height|w|h|size|door|window|column|room|area|remarks?|description|material|finish|thk|thickness|level|floor|length|dia)$/i;
function findScheduleTable(grid){
  /* a header row: 3+ short cells, most of which are schedule words */
  let best=null;
  grid.forEach((row,i)=>{
    const cells=row.map(c=>c.s.trim()).filter(Boolean);
    if(cells.length<3)return;
    const hits=cells.filter(c=>TABLE_WORDS.test(c.replace(/[^A-Za-z. ]/g,'').trim())).length;
    if(hits>=Math.max(2,Math.ceil(cells.length*0.4))&&(!best||hits>best.hits))
      best={i,hits,xs:row.map(c=>c.x)};
  });
  if(!best)return null;
  const cols=best.xs.slice().sort((a,b)=>a-b);
  const colOf=x=>{let k=0,d=Infinity;cols.forEach((c,i)=>{const dd=Math.abs(c-x);if(dd<d){d=dd;k=i;}});return k;};
  const out=[];
  for(let i=best.i;i<grid.length;i++){
    const cells=[];
    grid[i].forEach(c=>{const k=colOf(c.x);cells[k]=((cells[k]||'')+' '+c.s).trim();});
    if(!cells.filter(Boolean).length)break;
    for(let k=0;k<cols.length;k++)if(cells[k]===undefined)cells[k]='';
    out.push(cells);
    if(out.length>400)break;
  }
  return out.length>2?out:null;
}
async function pdfReadTables(){
  if(!PDFS.doc)return;
  const found=[];
  const from=1,to=PDFS.pages;
  for(let p=from;p<=to&&p<=from+29;p++){
    try{
      const g=textToGrid(await pdfTextItems(p));
      const t=findScheduleTable(g);
      if(t)found.push({name:PDFS.name.replace(/\.pdf$/i,'')+' — page '+p,rows:t});
    }catch(e){}
  }
  if(!found.length){
    toast('No schedule table found. The sheet may be a scan, which carries no text to read.');
    return;
  }
  IMP.sheets=found;IMP.si=0;IMP.file=PDFS.name;
  const first=found[0].rows[0].map(x=>String(x).toLowerCase()).join(' ');
  IMP.target=/door|window|leaf|glaz/.test(first)?'openings'
    :/column|col\b/.test(first)?'columns'
    :/room|space|finish/.test(first)?'rooms'
    :/beam/.test(first)?'beams'
    :/foot|found|pad/.test(first)?'footings':'openings';
  autoMap();openImportWizard();
  toast(found.length+' schedule table'+(found.length===1?'':'s')+' read off the drawing');
}
/* vector geometry: read the actual paths a CAD plot drew */
async function pdfScanGeometry(){
  if(!PDFS.doc){return;}
  if(PDFS.mPerUnit===null){toast('Set the scale first — auto-scale from the title block, or calibrate on a known dimension.');return;}
  const page=await PDFS.doc.getPage(PDFS.page);
  let ops;
  try{ops=await page.getOperatorList();}catch(e){toast('Could not read the drawing geometry: '+e.message);return;}
  const OPS=pdfjsLib.OPS;
  const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],
    a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
  const ap=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
  let ctm=[1,0,0,1,0,0];const stack=[];
  const polys=[],segs=[];
  const need={};need[OPS.moveTo]=2;need[OPS.lineTo]=2;need[OPS.curveTo]=6;
  need[OPS.curveTo2]=4;need[OPS.curveTo3]=4;need[OPS.closePath]=0;need[OPS.rectangle]=4;
  for(let i=0;i<ops.fnArray.length;i++){
    const fn=ops.fnArray[i],args=ops.argsArray[i];
    if(fn===OPS.save){stack.push(ctm.slice());continue;}
    if(fn===OPS.restore){ctm=stack.pop()||[1,0,0,1,0,0];continue;}
    if(fn===OPS.transform){ctm=mul(ctm,args);continue;}
    if(fn!==OPS.constructPath)continue;
    const pOps=args[0],co=args[1];
    let k=0,cur=[],started=null;
    const flush=closed=>{
      if(cur.length>1){
        let L=0;for(let j=1;j<cur.length;j++)L+=Math.hypot(cur[j][0]-cur[j-1][0],cur[j][1]-cur[j-1][1]);
        let A=0;
        if(closed&&cur.length>2){
          L+=Math.hypot(cur[0][0]-cur[cur.length-1][0],cur[0][1]-cur[cur.length-1][1]);
          for(let j=0;j<cur.length;j++){const a=cur[j],b=cur[(j+1)%cur.length];A+=a[0]*b[1]-b[0]*a[1];}
          A=Math.abs(A)/2;
        }
        if(closed&&A>0)polys.push({len:L,area:A});
        else segs.push({len:L});
      }
      cur=[];
    };
    for(let o=0;o<pOps.length;o++){
      const op=pOps[o],n=need[op]===undefined?0:need[op];
      if(op===OPS.rectangle){
        const x=co[k],y=co[k+1],w=co[k+2],h=co[k+3];
        const q=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(p=>ap(ctm,p[0],p[1]));
        let L=0;for(let j=0;j<4;j++)L+=Math.hypot(q[(j+1)%4][0]-q[j][0],q[(j+1)%4][1]-q[j][1]);
        let A=0;for(let j=0;j<4;j++){const a=q[j],b=q[(j+1)%4];A+=a[0]*b[1]-b[0]*a[1];}
        polys.push({len:L,area:Math.abs(A)/2});
      }else if(op===OPS.moveTo){flush(false);cur=[ap(ctm,co[k],co[k+1])];started=cur[0];}
      else if(op===OPS.lineTo){cur.push(ap(ctm,co[k],co[k+1]));}
      else if(op===OPS.curveTo){cur.push(ap(ctm,co[k+4],co[k+5]));}
      else if(op===OPS.curveTo2||op===OPS.curveTo3){cur.push(ap(ctm,co[k+2],co[k+3]));}
      else if(op===OPS.closePath){flush(true);}
      k+=n;
    }
    flush(false);
  }
  const U=PDFS.mPerUnit;
  const rooms=polys.map(p=>({area:p.area*U*U,perim:p.len*U}))
    .filter(p=>p.area>=4&&p.area<=400&&p.perim>0)
    .sort((a,b)=>b.area-a.area).slice(0,120);
  const runs=segs.map(s=>s.len*U).filter(L=>L>=1.5);
  PDFS.auto={rooms,runs,total:sum(runs),polys:polys.length,segs:segs.length};
  render();
  toast(rooms.length+' closed shapes and '+runs.length+' line runs found on this sheet');
}

      el('b',{},'No usable geometry on this page. '),
      'The sheet holds '+a.polys+' closed shapes and '+a.segs+' line runs, but none at a plausible building size. A scanned or photographed drawing is one flat image and carries no geometry at all — trace it by hand instead.'));
  const picks=a.rooms.map((r,i)=>Object.assign({},r,{on:false,i:i}));

    el('div',{class:'tw',style:'margin-top:10px;max-height:40vh'},

    el('div',{class:'row',style:'margin-top:10px'},

            floorFin:'tile',wallFin:'plaster+paint',ceilFin:'gyp',skirt:'y'});n++;});
        if(!n){toast('Tick the shapes you want to keep first.');return;}
        P.assumptions.push({text:n+' room areas scaled from the vector geometry of '+PDFS.name+' page '+PDFS.page+'; confirm against dimensioned information before pricing.'});
        touch();toast(n+' rooms written into the room schedule');
      }},'Add ticked shapes as rooms'),
      el('button',{class:'btn',onclick:()=>{
        P.measures.push({id:uid('m'),src:'pdf',name:'Line work, page '+PDFS.page,type:'len',
          value:a.total,unit:'m',wt:'',page:PDFS.page,file:PDFS.name});
        touch();toast('Total line length recorded as a measurement — set what it measures on the Measurements tab');
      }},'Record the '+f(a.total,1)+' m of line work'),
      el('button',{class:'btn gho',onclick:()=>{PDFS.auto=null;render();}},'Clear')));
  return el('div',{style:'margin-top:12px'},box);
}
